<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Assistant de devis · Entraîner l'IA</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f3e9;--card:#fbf8f2;--ink:#2a1c15;--soft:#6a5a4e;--line:rgba(42,28,21,.2);--good:#3d5a40;--bad:#8a2f24;}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IM Fell English','Songti SC','STSong','Noto Serif SC',Georgia,serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;}
html[lang=zh] *{font-style:normal !important}
.wrap{max-width:820px;margin:0 auto;padding:26px 20px 80px;}
.top{display:flex;justify-content:flex-end;gap:10px;font-size:14px;}
.top button{background:none;border:0;font:inherit;color:var(--soft);cursor:pointer;padding:2px 4px;}
.top button.on{color:var(--ink);text-decoration:underline;}
h1{font-weight:400;font-size:30px;margin:18px 0 4px;}
h2{font-weight:400;font-size:22px;margin:34px 0 8px;}
.lead{color:var(--soft);margin:0 0 6px;}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin:22px 0;}
.stats div{min-width:120px;}
.stats b{display:block;font-weight:400;font-size:28px;line-height:1.1;}
.stats span{font-size:14px;color:var(--soft);}
.btn{display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:inherit;padding:9px 18px;cursor:pointer;border-radius:0;}
.btn.ghost{background:transparent;color:var(--ink);}
.btn:disabled{opacity:.4;cursor:default;}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.card{display:grid;grid-template-columns:160px 1fr;gap:18px;border:1px solid var(--line);background:var(--card);padding:16px;margin:14px 0;}
.card img{width:160px;height:160px;object-fit:contain;background:#efe8db;}
@media (max-width:560px){.card{grid-template-columns:1fr}.card img{width:100%;height:auto;max-height:280px;}}
.grp{margin:0 0 10px;}
.grp > span{display:block;font-size:14px;color:var(--soft);margin-bottom:4px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chips label{position:relative;}
.chips input{position:absolute;opacity:0;pointer-events:none;}
.chips span{display:inline-block;border:1px solid var(--line);padding:5px 12px;cursor:pointer;}
.chips input:checked + span{border-color:var(--ink);background:var(--ink);color:var(--bg);}
.chips span i{font-style:normal;font-size:12px;opacity:.7;margin-left:6px;}
.note{font-size:14px;color:var(--soft);margin:2px 0 12px;}
.wait{color:var(--soft);}
.err{color:var(--bad);}
.ok{color:var(--good);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;}
.ex{font-size:13px;color:var(--soft);}
.ex img{width:100%;aspect-ratio:1;object-fit:contain;background:#efe8db;display:block;}
.ex.w img{outline:2px solid var(--bad);outline-offset:-2px;}
.ex button{background:none;border:0;font:inherit;color:var(--soft);text-decoration:underline;cursor:pointer;padding:0;}
.small{font-size:14px;color:var(--soft);}
</style>
</head><body>
<div class="wrap">
  <div class="top"><button data-l="fr">FR</button><button data-l="en">EN</button><button data-l="zh">中文</button></div>
  <h1 data-t="title"></h1>
  <p class="lead" data-t="lead1"></p>
  <p class="lead" data-t="lead2"></p>

  <div class="stats">
    <div><b id="sN">0</b><span data-t="sN"></span></div>
    <div><b id="sW">0</b><span data-t="sW"></span></div>
    <div><b id="sR">–</b><span data-t="sR"></span></div>
  </div>

  <div class="row">
    <label class="btn"><span data-t="add"></span><input type="file" id="file" accept="image/*" multiple hidden></label>
    <span class="small" id="queue"></span>
  </div>
  <p class="err" id="noEp" hidden data-t="noEp"></p>
  <div id="cards"></div>

  <h2 data-t="exTitle"></h2>
  <p class="small" data-t="exHelp"></p>
  <div class="grid" id="exList"></div>

  <h2 data-t="saveTitle"></h2>
  <p class="small" data-t="saveHelp"></p>
  <div class="row">
    <button class="btn ghost" id="exp" data-t="export"></button>
    <label class="btn ghost"><span data-t="import"></span><input type="file" id="imp" accept="application/json,.json" hidden></label>
    <span class="small" id="impMsg"></span>
  </div>
</div>
<script src="config.js"></script>
<script>
(function(){
var T = {
  fr:{title:"Entraîner l'IA à lire les images", lead1:"Ajoutez des images (vos flashs, des photos de tatouages, des références de clients). L'IA dit ce qu'elle voit : technique, couleur, quantité de détails. Corrigez si besoin, puis enregistrez l'image comme exemple.", lead2:"Avant chaque nouvelle image, l'IA regarde vos exemples pour juger comme vous. Quand elle a presque toujours raison, exportez les exemples : ils seront intégrés à l'assistant pour tous les tatoueurs. Rien n'est envoyé aux clients ni au tableau des demandes.",
    sN:"exemples", sW:"où l'IA s'était trompée", sR:"justes sur les 20 dernières", add:"Ajouter des images", queue:"en attente : ", noEp:"Le script Google n'est pas configuré (HQ_ENDPOINT).",
    wait:"L'IA regarde…", fail:"L'IA n'a pas répondu. Réessayez plus tard.", retry:"Réessayer", aiSays:"IA", tech:"Technique", color:"Couleur", cx:"Détails", save:"Enregistrer comme exemple", skip:"Ignorer", allRight:"L'IA avait tout juste.", fixed:"Corrigé : l'IA s'était trompée.",
    exTitle:"Exemples", exHelp:"Cadre rouge = l'IA s'était trompée (ces exemples comptent en priorité). Elle en voit au plus 12 à chaque fois.", del:"supprimer", none:"Pas encore d'exemple.",
    saveTitle:"Sauvegarder", saveHelp:"Les exemples restent dans ce navigateur. Exportez-les de temps en temps et envoyez le fichier pour qu'ils soient intégrés au site.", export:"Exporter les exemples", import:"Importer un fichier", imported:"exemples importés", full:"Mémoire du navigateur pleine : exportez puis supprimez quelques exemples.",
    L:{line:"trait seul", shade:"trait + ombrage", fill:"remplissage seul", bw:"noir et gris", col:"couleur", simple:"simple", medium:"moyen", complex:"beaucoup"}},
  en:{title:"Train the AI to read images", lead1:"Add images (your flashes, tattoo photos, client references). The AI says what it sees: technique, colour, amount of detail. Correct it if needed, then save the image as an example.", lead2:"Before each new image, the AI looks at your examples so it judges like you. Once it is almost always right, export the examples: they get built into the assistant for every artist. Nothing goes to clients or to the inquiry sheet.",
    sN:"examples", sW:"where the AI was wrong", sR:"right out of the last 20", add:"Add images", queue:"waiting: ", noEp:"The Google script is not set up (HQ_ENDPOINT).",
    wait:"The AI is looking…", fail:"The AI did not answer. Try again later.", retry:"Retry", aiSays:"AI", tech:"Technique", color:"Colour", cx:"Detail", save:"Save as example", skip:"Skip", allRight:"The AI got it all right.", fixed:"Corrected: the AI was wrong.",
    exTitle:"Examples", exHelp:"Red frame = the AI was wrong (these count first). It sees at most 12 each time.", del:"delete", none:"No examples yet.",
    saveTitle:"Back up", saveHelp:"Examples stay in this browser. Export them now and then and send the file so they can be built into the site.", export:"Export examples", import:"Import a file", imported:"examples imported", full:"Browser storage is full: export, then delete a few examples.",
    L:{line:"lines only", shade:"lines + shading", fill:"fill only", bw:"black & grey", col:"colour", simple:"simple", medium:"medium", complex:"lots"}},
  zh:{title:"训练 AI 看图", lead1:"上传图片（你的纹身稿、纹身照片、客人发来的参考图都行）。AI 会说它看到的技法、颜色和细节多少。错了就改，然后存成例子。", lead2:"之后每看一张新图，AI 都会先看你的例子，学你的判断标准。等它差不多每次都对了，就导出例子，我把它们装进系统，以后所有纹身师用的都是练好的版本。这里的一切都不会发给客人，也不进询价表格。",
    sN:"个例子", sW:"个是 AI 判断错过的", sR:"最近 20 张里 AI 全对的", add:"上传图片", queue:"排队中：", noEp:"还没连上 Google 后台（HQ_ENDPOINT）。",
    wait:"AI 正在看…", fail:"AI 没有回应，等一下再试。", retry:"再试一次", aiSays:"AI", tech:"技法", color:"颜色", cx:"细节", save:"存成例子", skip:"跳过", allRight:"AI 全对。", fixed:"已改正：AI 判断错了。",
    exTitle:"例子", exHelp:"红框 = AI 当时判断错了（这些会优先给 AI 看）。AI 每次最多看 12 个。", del:"删除", none:"还没有例子。",
    saveTitle:"备份", saveHelp:"例子存在这个浏览器里。时不时导出一下，把文件发给我，我装进网站。", export:"导出例子", import:"导入文件", imported:"个例子已导入", full:"浏览器存储满了：先导出，再删掉几个例子。",
    L:{line:"纯线条", shade:"线条+阴影", fill:"纯填色", bw:"黑灰", col:"彩色", simple:"简单", medium:"中等", complex:"细节多"}}
};
var G = [['t', 'tech', ['line', 'shade', 'fill']], ['c', 'color', ['bw', 'col']], ['x', 'cx', ['simple', 'medium', 'complex']]];
var KEY = 'hq-train', LOG = 'hq-train-log';
var lang = 'fr'; try { lang = localStorage.getItem('hyp-lang') || ((navigator.language || '').slice(0, 2) === 'zh' ? 'zh' : 'fr'); } catch(e){}
if(!T[lang]) lang = 'fr';
var artist = (/[?&]artist=([\w-]+)/.exec(location.search) || [])[1] || 'hypnum';
var ep = window.HQ_ENDPOINT, aiLang = (((window.HQ_ARTISTS || {})[artist] || {}).A || {}).mailLang || 'fr';
var ex = load(KEY, []), log = load(LOG, []), queue = [], busy = false;

function load(k, d){ try { return JSON.parse(localStorage.getItem(k)) || d; } catch(e){ return d; } }
function store(){ try { localStorage.setItem(KEY, JSON.stringify(ex)); localStorage.setItem(LOG, JSON.stringify(log.slice(-50))); return true; } catch(e){ alertFull(); return false; } }
function alertFull(){ var m = document.getElementById('impMsg'); m.className = 'small err'; m.textContent = T[lang].full; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function paint(){
  var t = T[lang]; document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = t[el.dataset.t]; });
  document.querySelectorAll('.top button').forEach(function(b){ b.classList.toggle('on', b.dataset.l === lang); });
  document.getElementById('noEp').hidden = !!ep;
  document.querySelectorAll('.card').forEach(function(c){ if(c._paint) c._paint(); });
  stats(); list();
}
function stats(){
  document.getElementById('sN').textContent = ex.length;
  document.getElementById('sW').textContent = ex.filter(function(e){ return e.w; }).length;
  var last = log.slice(-20);
  document.getElementById('sR').textContent = last.length ? last.filter(Boolean).length + ' / ' + last.length : '–';
  document.getElementById('queue').textContent = queue.length ? T[lang].queue + queue.length : '';
}
function label(e){ var L = T[lang].L; return [L[e.t], L[e.c], L[e.x]].join(' · '); }
function list(){
  var box = document.getElementById('exList'), t = T[lang];
  if(!ex.length){ box.innerHTML = '<p class="small">' + t.none + '</p>'; return; }
  box.innerHTML = ex.slice().reverse().map(function(e){
    return '<div class="ex' + (e.w ? ' w' : '') + '"><img alt="" src="data:' + e.type + ';base64,' + e.data + '"><div>' + esc(label(e)) + '</div><button data-del="' + e.id + '">' + t.del + '</button></div>';
  }).join('');
}
document.getElementById('exList').addEventListener('click', function(ev){
  var id = ev.target.dataset && ev.target.dataset.del; if(!id) return;
  ex = ex.filter(function(e){ return e.id !== id; }); store(); stats(); list();
});

/* image -> JPEG réduit (côté max px) en base64 */
function shrink(file, max){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){
      var k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
      var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82).split(',')[1]);
    };
    im.onerror = function(){ URL.revokeObjectURL(url); rej(); };
    im.src = url;
  });
}
/* même choix que le script : 8 erreurs au plus, puis les plus récents, 12 en tout */
function pick(){
  var w = ex.filter(function(e){ return e.w; }).slice(-8), r = ex.filter(function(e){ return !e.w; });
  return w.concat(r.slice(-(12 - w.length))).map(function(e){ return {type:e.type, data:e.data, t:e.t, c:e.c, x:e.x, w:e.w}; });
}

document.getElementById('file').addEventListener('change', function(){
  [].forEach.call(this.files, function(f){ if(/^image\//.test(f.type)) queue.push(f); });
  this.value = ''; stats(); next();
});
function next(){
  if(busy || !queue.length || !ep) return;
  busy = true; var f = queue.shift(); stats();
  Promise.all([shrink(f, 1024), shrink(f, 448)]).then(function(r){ card(r[0], r[1]); }, function(){ busy = false; next(); });
}

function card(big, small){
  var t, c = document.createElement('div'), id = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  c.className = 'card';
  c.innerHTML = '<img alt="" src="data:image/jpeg;base64,' + small + '"><div class="body"></div>';
  document.getElementById('cards').prepend(c);
  var body = c.querySelector('.body'), ai = null, state = 'wait', note = '';
  c._paint = function(){
    t = T[lang];
    if(state === 'wait'){ body.innerHTML = '<p class="wait">' + t.wait + '</p>'; return; }
    if(state === 'fail'){ body.innerHTML = '<p class="err">' + t.fail + '</p><button class="btn ghost" data-act="retry">' + t.retry + '</button>'; return; }
    var cur = {}; G.forEach(function(g){ var el = body.querySelector('input[name=' + id + g[0] + ']:checked'); cur[g[0]] = el ? el.value : ai[g[0]]; });
    body.innerHTML = G.map(function(g){
      return '<div class="grp"><span>' + t[g[1]] + '</span><div class="chips">' + g[2].map(function(v){
        return '<label><input type="radio" name="' + id + g[0] + '" value="' + v + '"' + (cur[g[0]] === v ? ' checked' : '') + '><span>' + t.L[v] + (ai[g[0]] === v ? '<i>' + t.aiSays + '</i>' : '') + '</span></label>';
      }).join('') + '</div></div>';
    }).join('') + (note ? '<p class="note">' + esc(note) + '</p>' : '') +
      '<div class="row"><button class="btn" data-act="save">' + t.save + '</button><button class="btn ghost" data-act="skip">' + t.skip + '</button></div>';
  };
  function ask(){
    state = 'wait'; c._paint();
    fetch(ep, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action:'analyse', train:1, artist:artist, lang:lang, ai_lang:lang, type:'own', size:'', idea:'',
      images:[{name:'img.jpg', type:'image/jpeg', data:big}], examples:pick()})})
    .then(function(r){ return r.json(); }).then(function(j){
      if(!j.ok || !j.ai) throw 0;
      ai = {t:j.ai.technique, c:j.ai.color, x:j.ai.complexity}; note = j.ai.note_artist || ''; state = 'ready'; c._paint();
    }).catch(function(){ state = 'fail'; c._paint(); busy = false; next(); });
  }
  body.addEventListener('click', function(ev){
    var act = ev.target.dataset && ev.target.dataset.act; if(!act) return;
    if(act === 'retry'){ if(busy){ return; } busy = true; ask(); return; }
    if(act === 'skip'){ c.remove(); done(); return; }
    if(act === 'save'){
      var e = {id:id, type:'image/jpeg', data:small, ai:ai, date:new Date().toISOString().slice(0, 10)};
      G.forEach(function(g){ var el = body.querySelector('input[name=' + id + g[0] + ']:checked'); e[g[0]] = el ? el.value : ai[g[0]]; });
      e.w = G.some(function(g){ return e[g[0]] !== ai[g[0]]; });
      ex.push(e); log.push(!e.w);
      if(!store()){ ex.pop(); log.pop(); return; }
      c.innerHTML = '<p class="' + (e.w ? 'err' : 'ok') + '">' + (e.w ? T[lang].fixed : T[lang].allRight) + ' ' + esc(label(e)) + '</p>';
      c.style.gridTemplateColumns = '1fr'; c._paint = null;
      setTimeout(function(){ c.remove(); }, 2500);
      stats(); list(); done();
    }
  });
  /* l'image suivante n'est montrée à l'IA qu'après celle-ci : elle profite ainsi de la correction */
  function done(){ if(state === 'ready'){ state = 'end'; busy = false; next(); } }
  ask();
}

document.getElementById('exp').addEventListener('click', function(){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({artist:artist, v:1, examples:ex})], {type:'application/json'}));
  a.download = artist + '-ai-exemples-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
});
document.getElementById('imp').addEventListener('change', function(){
  var f = this.files[0], m = document.getElementById('impMsg'); this.value = ''; if(!f) return;
  f.text().then(function(s){
    var j = JSON.parse(s), have = {}, n = 0;
    ex.forEach(function(e){ have[e.id] = 1; });
    (j.examples || []).forEach(function(e){ if(e && e.id && e.data && !have[e.id]){ ex.push(e); n++; } });
    if(store()){ m.className = 'small ok'; m.textContent = n + ' ' + T[lang].imported; }
    stats(); list();
  }).catch(function(){ m.className = 'small err'; m.textContent = '?'; });
});
document.querySelectorAll('.top button').forEach(function(b){ b.addEventListener('click', function(){ lang = b.dataset.l; try { localStorage.setItem('hyp-lang', lang); } catch(e){} paint(); }); });
paint();
})();
</script>
</body></html>
