<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demande de devis · Hypnum</title>
<meta name="description" content="Demande de devis pour un tatouage sur mesure, Hypnum Paris.">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f8f3e9;color:#2a1c15;font-family:'IM Fell English','Songti SC','STSong','Noto Serif SC',Georgia,serif;-webkit-text-size-adjust:100%;}
.dv-top{max-width:640px;margin:0 auto;padding:28px 22px 0;display:flex;justify-content:space-between;align-items:center;}
.dv-top a{color:inherit;font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:3px;}
.dv-foot{max-width:640px;margin:0 auto;padding:10px 22px 48px;font-size:13px;color:#6a5a4e;display:flex;gap:18px;flex-wrap:wrap;}
.dv-foot a{color:inherit;}
.hq input,.hq textarea,.hq select{font-size:16px !important;}
.hq form{grid-template-columns:minmax(0,1fr);}
.hq-chips span{white-space:normal;}
.hq input[type=file]{max-width:100%;font-size:14px !important;}
</style>
</head>
<body>
<div class="dv-top"><a href="/">← Hypnum</a><a href="/#reservation">Réservation</a></div>
<!-- ===== Hypnum Paris · Formulaire de devis (询价助手 v1) =====
     粘贴位置：放进 hypnum.fr 任意页面的 <body> 里你想显示表单的地方。
     改价格：只改下面 HQ_CONFIG 里的数字。
     接后台：把 ENDPOINT 换成 Google Apps Script 部署后给你的网址。 -->
<div id="hq-root" class="hq"></div>

<style>
.hq{
  /* 颜色和字体：想配合网站，改这几行就行 */
  --hq-paper:#f8f3e9; --hq-card:#fbf8f2; --hq-ink:#2a1c15; --hq-mute:#6a5a4e;
  --hq-line:rgba(42,28,21,.2); --hq-accent:#2a1c15; --hq-accent-ink:#f8f3e9; --hq-good:#3d5a40;
  --hq-display:"IM Fell English","Songti SC","STSong","Noto Serif SC",Georgia,serif; --hq-body:"IM Fell English","Songti SC","STSong","Noto Serif SC",Georgia,serif;
  font-family:var(--hq-body); color:var(--hq-ink); background:var(--hq-paper);
  max-width:640px; margin:0 auto; padding:28px 22px; border-radius:6px; box-sizing:border-box;
  font-size:15px; line-height:1.5;
}
.hq *{box-sizing:border-box}
.hq-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hq h2{font-family:var(--hq-display);font-weight:500;font-size:1.7rem;line-height:1.15;margin:0;text-wrap:balance}
.hq-sub{color:var(--hq-mute);margin:6px 0 0;font-size:.92rem}
.hq-lang{display:flex;border:1px solid var(--hq-line);border-radius:999px;overflow:hidden}
.hq-lang button{border:0;background:transparent;color:var(--hq-mute);padding:5px 11px;font:inherit;font-size:.8rem;cursor:pointer}
.hq-lang button[aria-pressed="true"]{background:var(--hq-ink);color:var(--hq-paper)}
.hq form{display:grid;gap:18px;margin-top:22px}
.hq fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
.hq label.hq-l{display:block}
.hq legend,.hq label.hq-l{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--hq-mute);font-weight:600;padding:0;margin-bottom:6px}
.hq-chips{display:flex;flex-wrap:wrap;gap:6px}
.hq-chips label{position:relative}
.hq-chips input{position:absolute;opacity:0;pointer-events:none}
.hq-chips span{display:inline-block;padding:7px 12px;border:1px solid var(--hq-line);border-radius:4px;background:var(--hq-card);cursor:pointer;font-size:.9rem}
.hq-chips span small{color:var(--hq-mute);margin-left:4px}
.hq-chips input:checked+span{border-color:var(--hq-accent);background:var(--hq-accent);color:var(--hq-accent-ink)}
.hq-chips input:checked+span small{color:inherit;opacity:.8}
.hq-chips input:focus-visible+span{outline:2px solid var(--hq-accent);outline-offset:2px}
.hq input[type=text],.hq input[type=email],.hq input[type=tel],.hq input[type=number],.hq textarea,.hq select{
  width:100%;padding:10px 12px;border:1px solid var(--hq-line);border-radius:4px;background:var(--hq-card);color:var(--hq-ink);font:inherit}
.hq input:focus-visible,.hq textarea:focus-visible,.hq select:focus-visible{outline:2px solid var(--hq-accent);outline-offset:1px}
.hq textarea{min-height:90px;resize:vertical}
.hq-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.hq-row{grid-template-columns:1fr}}
.hq-files{font-size:.85rem;color:var(--hq-mute)}
.hq-thumbs{display:flex;gap:6px;flex-wrap:wrap}
.hq-thumbs img{width:64px;height:64px;object-fit:cover;border-radius:3px;border:1px solid var(--hq-line)}
.hq-est{border:1px solid var(--hq-ink);border-radius:4px;padding:16px;background:var(--hq-card);display:grid;gap:4px}
.hq-est .k{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--hq-mute);font-weight:600}
.hq-est .v{font-family:var(--hq-display);font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1}
.hq-est .n{font-size:.85rem;color:var(--hq-mute)}
.hq-btn{background:var(--hq-ink);color:var(--hq-paper);border:0;border-radius:4px;padding:13px 18px;font:inherit;font-weight:600;cursor:pointer}
.hq-btn:disabled{opacity:.5;cursor:wait}
.hq-btn:focus-visible{outline:2px solid var(--hq-accent);outline-offset:2px}
.hq-msg{font-size:.9rem;margin:0}
.hq-msg.ok{color:var(--hq-good)} .hq-msg.err{color:#a3322a}
.hq-check{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;color:var(--hq-mute)}
.hq-check input{margin-top:3px}
</style>

<script>
(function(){
/* ============ 1. 价格规则（示例数字，等 Haibei 给真实规则后替换） ============ */
var HQ_CONFIG = {
  ENDPOINT: "",          // ← Google Apps Script 网址，空着 = 演示模式（不发送）
  currency: "€",
  minimum: 120,          // 最低起价
  deposit: { percent: 30, min: 50 },   // 定金 = 价格下限的 30%，至少 50€
  sizes: {               // 按尺寸的基础价格区间
    xs: [120, 180],      // < 5 cm
    s:  [180, 300],      // 5–10 cm
    m:  [300, 500],      // 10–15 cm
    l:  [500, 900],      // 15–25 cm
    xl: null             // 半臂/大面积 → 按天报价
  },
  dayRate: 800,          // 大面积按天价格
  colorExtra: 0.20,      // 彩色 +20%
  placementExtra: { ribs:0.15, hand:0.15, neck:0.15, foot:0.10 } // 难做部位加价
};

/* ============ 2. 三语文字 ============ */
var T = {
 fr:{title:"Demande de devis",sub:"Décris ton projet, tu verras une estimation tout de suite. Je te réponds sous 48 h.",
  style:"Style",size:"Taille",place:"Emplacement",color:"Couleur",ref:"Images de référence",refHint:"Jusqu'à 3 images, 5 Mo max chacune.",
  idea:"Ton idée",ideaPh:"Le sujet, l'ambiance, ce qui compte pour toi…",budget:"Budget (€)",dates:"Disponibilités",datesPh:"ex. samedis en décembre",
  name:"Prénom",email:"E-mail",phone:"Téléphone / Instagram",consent:"J'accepte que ces informations soient utilisées pour répondre à ma demande.",
  est:"Estimation",dep:"Acompte pour réserver",send:"Envoyer ma demande",sending:"Envoi…",
  ok:"Merci ! Ta demande est bien envoyée. Je te réponds sous 48 h.",err:"L'envoi n'a pas marché. Réessaie, ou écris-moi sur Instagram.",
  demo:"Mode démo : rien n'a été envoyé.",need:"Choisis au moins la taille, l'emplacement et laisse un e-mail.",
  note:"Estimation indicative. Le prix final dépend du dessin et du temps réel.",day:"Grande pièce : en séances, environ {d}/jour",
  styles:{fine:"Fine line",black:"Blackwork",real:"Réaliste",orn:"Ornemental",letter:"Lettrage",other:"Autre"},
  sizesL:{xs:"< 5 cm",s:"5–10 cm",m:"10–15 cm",l:"15–25 cm",xl:"Demi-manche ou plus"},
  places:{arm:"Bras",forearm:"Avant-bras",leg:"Jambe",back:"Dos",chest:"Poitrine",ribs:"Côtes",hand:"Main / doigts",neck:"Cou",foot:"Pied / cheville"},
  colors:{bw:"Noir & gris",col:"Couleur"}},
 en:{title:"Tattoo inquiry",sub:"Describe your project and see an estimate right away. I reply within 48 h.",
  style:"Style",size:"Size",place:"Placement",color:"Colour",ref:"Reference images",refHint:"Up to 3 images, 5 MB each.",
  idea:"Your idea",ideaPh:"Subject, mood, what matters to you…",budget:"Budget (€)",dates:"Availability",datesPh:"e.g. Saturdays in December",
  name:"First name",email:"Email",phone:"Phone / Instagram",consent:"I agree that this information is used to answer my request.",
  est:"Estimate",dep:"Deposit to book",send:"Send my inquiry",sending:"Sending…",
  ok:"Thank you! Your inquiry was sent. I'll reply within 48 h.",err:"Sending failed. Please try again, or message me on Instagram.",
  demo:"Demo mode: nothing was sent.",need:"Pick at least a size and placement, and leave an email.",
  note:"Rough estimate. The final price depends on the design and actual time.",day:"Large piece: in sessions, about {d}/day",
  styles:{fine:"Fine line",black:"Blackwork",real:"Realism",orn:"Ornamental",letter:"Lettering",other:"Other"},
  sizesL:{xs:"< 5 cm",s:"5–10 cm",m:"10–15 cm",l:"15–25 cm",xl:"Half sleeve or bigger"},
  places:{arm:"Upper arm",forearm:"Forearm",leg:"Leg",back:"Back",chest:"Chest",ribs:"Ribs",hand:"Hand / fingers",neck:"Neck",foot:"Foot / ankle"},
  colors:{bw:"Black & grey",col:"Colour"}},
 zh:{title:"纹身询价",sub:"描述你的想法，马上看到大概价格。我会在 48 小时内回复。",
  style:"风格",size:"大小",place:"部位",color:"颜色",ref:"参考图",refHint:"最多 3 张，每张不超过 5 MB。",
  idea:"你的想法",ideaPh:"图案、感觉、对你重要的点……",budget:"预算 (€)",dates:"方便的时间",datesPh:"例如：12 月的周六",
  name:"名字",email:"邮箱",phone:"电话 / Instagram / 微信",consent:"我同意这些信息用于回复我的询价。",
  est:"预估价格",dep:"预约定金",send:"发送询价",sending:"发送中…",
  ok:"谢谢！询价已发送，我会在 48 小时内回复。",err:"发送失败，请再试一次，或在 Instagram 私信我。",
  demo:"演示模式：没有真的发送。",need:"请至少选择大小、部位，并留下邮箱。",
  note:"仅为大概估价，最终价格取决于图案和实际时长。",day:"大面积：分次完成，约 {d}/天",
  styles:{fine:"细线",black:"暗黑/黑工",real:"写实",orn:"装饰",letter:"字母",other:"其他"},
  sizesL:{xs:"< 5 cm",s:"5–10 cm",m:"10–15 cm",l:"15–25 cm",xl:"半臂或更大"},
  places:{arm:"上臂",forearm:"小臂",leg:"腿",back:"背",chest:"胸",ribs:"肋骨",hand:"手 / 手指",neck:"脖子",foot:"脚 / 脚踝"},
  colors:{bw:"黑灰",col:"彩色"}}
};

var root=document.getElementById("hq-root"), C=HQ_CONFIG, lang="fr", files=[], state={};
try{var nl=(navigator.language||"").slice(0,2); if(T[nl]) lang=nl;}catch(e){}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function chips(name,obj,type,extra){var h='<div class="hq-chips">';for(var k in obj){h+='<label><input type="'+type+'" name="'+name+'" value="'+k+'"'+(state[name]&&[].concat(state[name]).indexOf(k)>-1?" checked":"")+'><span>'+esc(obj[k])+(extra&&extra[k]?'<small>'+extra[k]+'</small>':'')+'</span></label>'}return h+'</div>'}
function money(n){return Math.round(n/10)*10+" "+C.currency}

function estimate(){
  var f=root.querySelector("form"); if(!f) return null;
  var size=(f.querySelector('[name=size]:checked')||{}).value, place=(f.querySelector('[name=place]:checked')||{}).value,
      color=(f.querySelector('[name=color]:checked')||{}).value;
  if(!size) return null;
  if(!C.sizes[size]) return {day:true};
  var m=1+(color==="col"?C.colorExtra:0)+(C.placementExtra[place]||0);
  var lo=Math.max(C.minimum,C.sizes[size][0]*m), hi=Math.max(C.minimum,C.sizes[size][1]*m);
  var dep=Math.max(C.deposit.min,lo*C.deposit.percent/100);
  return {lo:Math.round(lo/10)*10,hi:Math.round(hi/10)*10,dep:Math.round(dep/10)*10};
}
function paintEst(){
  var t=T[lang],e=estimate(),box=root.querySelector(".hq-est");
  if(!e){box.hidden=true;return}
  box.hidden=false;
  box.innerHTML=e.day
    ? '<span class="k">'+t.est+'</span><span class="v" style="font-size:1.3rem">'+esc(t.day.replace("{d}",money(C.dayRate)))+'</span><span class="n">'+t.note+'</span>'
    : '<span class="k">'+t.est+'</span><span class="v">'+e.lo+' – '+e.hi+' '+C.currency+'</span><span class="n">'+t.dep+' : '+e.dep+' '+C.currency+'</span><span class="n">'+t.note+'</span>';
}
function save(){var f=root.querySelector("form");if(!f)return;state={};new FormData(f).forEach(function(v,k){if(k==="refs")return;if(k==="style"){(state.style=state.style||[]).push(v)}else state[k]=v})}

function render(){
  save(); var t=T[lang];
  root.innerHTML='<div class="hq-top"><div><h2>'+t.title+'</h2><p class="hq-sub">'+t.sub+'</p></div>'
   +'<div class="hq-lang" role="group" aria-label="Language">'+["fr","en","zh"].map(function(l){return'<button type="button" data-l="'+l+'" aria-pressed="'+(l===lang)+'">'+{fr:"FR",en:"EN",zh:"中文"}[l]+'</button>'}).join("")+'</div></div>'
   +'<form novalidate>'
   +'<fieldset><legend>'+t.style+'</legend>'+chips("style",t.styles,"checkbox")+'</fieldset>'
   +'<fieldset><legend>'+t.size+'</legend>'+chips("size",t.sizesL,"radio")+'</fieldset>'
   +'<fieldset><legend>'+t.place+'</legend>'+chips("place",t.places,"radio")+'</fieldset>'
   +'<fieldset><legend>'+t.color+'</legend>'+chips("color",t.colors,"radio")+'</fieldset>'
   +'<div class="hq-est" aria-live="polite" hidden></div>'
   +'<div><label class="hq-l" for="hq-idea">'+t.idea+'</label><textarea id="hq-idea" name="idea" placeholder="'+t.ideaPh+'">'+esc(state.idea||"")+'</textarea></div>'
   +'<div><label class="hq-l" for="hq-refs">'+t.ref+'</label><input id="hq-refs" type="file" name="refs" accept="image/*" multiple><div class="hq-files">'+t.refHint+'</div><div class="hq-thumbs"></div></div>'
   +'<div class="hq-row"><div><label class="hq-l" for="hq-budget">'+t.budget+'</label><input id="hq-budget" type="number" min="0" name="budget" value="'+esc(state.budget||"")+'"></div>'
   +'<div><label class="hq-l" for="hq-dates">'+t.dates+'</label><input id="hq-dates" type="text" name="dates" placeholder="'+t.datesPh+'" value="'+esc(state.dates||"")+'"></div></div>'
   +'<div class="hq-row"><div><label class="hq-l" for="hq-name">'+t.name+'</label><input id="hq-name" type="text" name="name" autocomplete="given-name" value="'+esc(state.name||"")+'"></div>'
   +'<div><label class="hq-l" for="hq-email">'+t.email+'</label><input id="hq-email" type="email" name="email" autocomplete="email" value="'+esc(state.email||"")+'"></div></div>'
   +'<div><label class="hq-l" for="hq-phone">'+t.phone+'</label><input id="hq-phone" type="text" name="phone" value="'+esc(state.phone||"")+'"></div>'
   +'<label class="hq-check"><input type="checkbox" name="consent" id="hq-consent"'+(state.consent?" checked":"")+'> '+t.consent+'</label>'
   +'<button class="hq-btn" type="submit">'+t.send+'</button><p class="hq-msg" aria-live="polite"></p></form>';
  root.querySelectorAll(".hq-lang button").forEach(function(b){b.onclick=function(){lang=b.dataset.l;render()}});
  var f=root.querySelector("form");
  f.addEventListener("change",paintEst);
  root.querySelector("#hq-refs").addEventListener("change",function(ev){
    files=[].slice.call(ev.target.files).filter(function(x){return x.size<=5e6}).slice(0,3);
    root.querySelector(".hq-thumbs").innerHTML=files.map(function(x){return'<img alt="" src="'+URL.createObjectURL(x)+'">'}).join("");
  });
  f.addEventListener("submit",submit);
  paintEst();
}

function toB64(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res({name:file.name,type:file.type,data:String(r.result).split(",")[1]})};r.onerror=rej;r.readAsDataURL(file)})}

function submit(ev){
  ev.preventDefault(); var t=T[lang], f=ev.target, msg=f.querySelector(".hq-msg"), btn=f.querySelector(".hq-btn");
  var d={}; new FormData(f).forEach(function(v,k){if(k==="refs")return;d[k]=k==="style"?(d[k]?d[k]+", ":"")+v:v});
  if(!d.size||!d.place||!/.+@.+\..+/.test(d.email||"")||!d.consent){msg.className="hq-msg err";msg.textContent=t.need;return}
  var e=estimate()||{}; d.estimate_low=e.lo||""; d.estimate_high=e.hi||""; d.deposit=e.dep||""; d.lang=lang; d.page=location.href;
  if(!C.ENDPOINT){msg.className="hq-msg ok";msg.textContent=t.demo+" "+t.ok;return}
  btn.disabled=true; btn.textContent=t.sending;
  Promise.all(files.map(toB64)).then(function(imgs){
    d.images=imgs;
    return fetch(C.ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)});
  }).then(function(r){return r.json()}).then(function(j){
    if(!j.ok) throw 0; msg.className="hq-msg ok"; msg.textContent=t.ok; f.reset(); files=[]; state={};
    root.querySelector(".hq-thumbs").innerHTML=""; paintEst();
  }).catch(function(){msg.className="hq-msg err";msg.textContent=t.err})
  .then(function(){btn.disabled=false;btn.textContent=t.send});
}
render();
})();
</script>
<!-- ===== fin du formulaire ===== -->

<div class="dv-foot"><a href="/cgv.html">CGV</a><a href="/mentions-legales.html">Mentions légales</a><a href="mailto:contact@hypnum.fr">contact@hypnum.fr</a></div>
</body></html>
