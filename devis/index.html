<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demande de devis · Hypnum</title>
<meta name="description" content="Demande de devis pour un tatouage, avec une estimation immédiate du prix. Hypnum, Paris.">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f3e9;--card:#fbf8f2;--ink:#2a1c15;--soft:#6a5a4e;--line:rgba(42,28,21,.2);--good:#3d5a40;--bad:#8a2f24;}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IM Fell English','Songti SC','STSong','Noto Serif SC',Georgia,serif;font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%;}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:28px 22px 56px;}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;}
.top a{font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:3px;}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--soft);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
h1{font-weight:400;font-size:34px;line-height:1.2;margin:34px 0 6px;}
.sub{margin:0;color:var(--soft);font-style:italic;font-size:16px;}
html[lang=zh] .sub,html[lang=zh] .pf-n,html[lang=zh] .hint{font-style:normal}
.grid{display:grid;gap:34px;margin-top:28px;}
@media (min-width:880px){ .grid{grid-template-columns:minmax(0,1fr) 300px;align-items:start;} .pf{position:sticky;top:24px;order:2} }
.pf{border:1px solid var(--line);background:var(--card);padding:20px 20px 16px;}
.pf h2{font-weight:400;font-size:22px;margin:0 0 4px;}
.pf-n{margin:0 0 12px;color:var(--soft);font-style:italic;font-size:15px;}
.pf dl{margin:0;display:grid;gap:10px;font-size:15px;line-height:1.45;}
.pf dt{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);}
.pf dd{margin:2px 0 0;}
html[lang=zh] .pf dt,html[lang=zh] .lb{letter-spacing:.08em;font-size:13px;}
form{display:grid;gap:26px;grid-template-columns:minmax(0,1fr);}
fieldset{border:0;margin:0;padding:0;display:grid;gap:10px;min-width:0;}
legend,.lb{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:0;margin-bottom:10px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chips label{position:relative;}
.chips input{position:absolute;opacity:0;pointer-events:none;}
.chips span{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:8px 14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:16px;line-height:1.25;}
.chips input:checked + span{background:var(--ink);border-color:var(--ink);color:var(--bg);}
.chips input:focus-visible + span{outline:2px solid var(--ink);outline-offset:2px;}
.chips.tech span{flex-direction:column;align-items:flex-start;gap:6px;width:100%;}
.chips.tech{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}
.chips.tech label{display:flex;}
.chips.tech svg{width:46px;height:30px;stroke:currentColor;fill:none;stroke-width:1.3;}
.hint{margin:0;color:var(--soft);font-size:14px;font-style:italic;}
input[type=text],input[type=email],input[type=number],textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:0;background:var(--card);color:var(--ink);font:inherit;font-size:16px;}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px;}
textarea{min-height:110px;resize:vertical;}
input[type=file]{max-width:100%;font:inherit;font-size:14px;}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:1px;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:560px){ .row{grid-template-columns:1fr;} }
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.thumbs img{width:64px;height:64px;object-fit:cover;border:1px solid var(--line);}
.est{border:1px solid var(--ink);background:var(--card);padding:18px 18px 16px;display:grid;gap:4px;}
.est .k{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);}
.est .v{font-size:34px;line-height:1.15;font-variant-numeric:tabular-nums;}
.est .l{font-size:15px;}
.est .n{font-size:14px;color:var(--soft);font-style:italic;margin-top:6px;}
html[lang=zh] .est .n{font-style:normal;}
.est.no{border-color:var(--bad);}
.est.no .v{font-size:18px;line-height:1.45;color:var(--bad);}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.45;}
.check input{margin-top:4px;flex:none;width:18px;height:18px;accent-color:var(--ink);}
.btn{background:var(--ink);color:var(--bg);border:0;min-height:54px;padding:12px 18px;font:inherit;font-size:14px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;}
html[lang=zh] .btn{font-size:17px;letter-spacing:.1em;}
.btn:disabled{opacity:.5;cursor:wait;}
.msg{margin:0;font-size:15px;}
.msg.ok{color:var(--good);} .msg.err{color:var(--bad);}
.closed{margin-top:40px;font-size:18px;max-width:560px;}
.miss{margin-top:18px;font-size:14px;color:var(--soft);}
.foot{margin-top:46px;font-size:13px;color:var(--soft);display:flex;gap:18px;flex-wrap:wrap;}
.req{color:var(--soft);}
</style>
</head>

var T = {

 since:'纹身 {y}', y0:'不到一年', y1:'{n} 年', yn:'{n} 年', yp1:'一年多', ypn:'{n} 年多',
 styles:'风格', where:'地点', langs:'语言', retouch:'补色', rt:'{m} 个月内免费补色 {n} 次', rtn:'{m} 个月内免费补色 {n} 次', rt0:'不提供免费补色',

};
var lang = 'fr';
try{ var nl = (navigator.language || '').slice(0, 2); if(T[nl]) lang = nl; }catch(e){}
try{ var sl = localStorage.getItem('hyp-lang'); if(sl && T[sl]) lang = sl; }catch(e){}
var files = [], st = {};
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function f(s, o){ return s.replace(/\{(\w)\}/g, function(_, k){ return o[k]; }); }
function lab(x){ return x.l[lang] || x.l.fr; }
function find(list, k){ return list.filter(function(x){ return x.k === k; })[0]; }

function replyTxt(){ var t = T[lang], r = cfg.A.reply; return f(r.unit === 'd' ? (r.n === 1 ? t.d1 : t.d) : t.h, {n:r.n}).trim(); }
function yearsTxt(y){ var t = T[lang], n = Math.floor(y); if(y < 1) return t.y0; if(y > n) return f(n === 1 ? t.yp1 : t.ypn, {n:n}); return f(n === 1 ? t.y1 : t.yn, {n:n}); }

function langBar(){
  var b = document.querySelector('.lang');
  b.innerHTML = ['fr','en','zh'].map(function(l){ return '<button type="button" data-l="' + l + '" aria-pressed="' + (l === lang) + '">' + {fr:'FR', en:'EN', zh:'中文'}[l] + '</button>'; }).join('');
  b.querySelectorAll('button').forEach(function(x){ x.onclick = function(){ save(); lang = x.getAttribute('data-l'); render(); }; });
}

function profile(){
  var t = T[lang], A = cfg.A;
  var lg = A.languages.map(function(k){ var x = find(D.LANGS, k); return x ? x.l : k; }).join(', ');
  var rt = A.retouch.free > 0 ? f(A.retouch.free > 1 ? t.rtn : t.rt, {n:A.retouch.free, m:A.retouch.months}) : t.rt0;
  var pay = A.payment.map(function(k){ var x = find(D.PAY, k); return x ? lab(x) : k; }).concat(A.payOther ? [A.payOther] : []).join(', ');
  var rf = (A.refuse || []).map(function(k){ return lab(find(D.REFUSE, k)); }).concat(A.refuseOther ? [A.refuseOther] : []);
  /* fiche client : langues, retouches, paiement, refus, délai de réponse et Instagram */
  return '<aside class="pf"><h2>' + esc(A.name) + '</h2><dl>' +
    '<div><dt>' + t.langs + '</dt><dd>' + esc(lg) + '</dd></div>' +
    '<div><dt>' + t.retouch + '</dt><dd>' + esc(rt) + '</dd></div>' +
    '<div><dt>' + t.pay + '</dt><dd>' + esc(pay) + '</dd></div>' +
    (rf.length ? '<div><dt>' + t.refuse + '</dt><dd>' + esc(rf.join(', ')) + '</dd></div>' : '') +
    '<div><dt>' + t.reply + '</dt><dd>' + esc(replyTxt()) + '</dd></div>' +
    (A.instagram ? '<div><dt>Instagram</dt><dd><a href="https://www.instagram.com/' + esc(A.instagram) + '" target="_blank" rel="noopener">@' + esc(A.instagram) + '</a></dd></div>' : '') +
    '</dl></aside>';
}

var ICON = {
  line:'<svg viewBox="0 0 46 30"><path d="M6 24 C10 6 20 4 23 15 C26 26 36 24 40 6"/></svg>',
  shade:'<svg viewBox="0 0 46 30"><path d="M6 24 C10 6 20 4 23 15 C26 26 36 24 40 6"/><path d="M10 22 l4 -6 M14 23 l4 -9 M18 24 l3 -6 M27 22 l4 -5 M31 22 l4 -8 M35 20 l3 -7" stroke-width=".9"/></svg>',
  fill:'<svg viewBox="0 0 46 30"><path d="M6 24 C10 6 20 4 23 15 C26 26 36 24 40 6 L40 26 L6 26 Z" fill="currentColor" fill-opacity=".55" stroke="none"/></svg>',
  unsure:'<svg viewBox="0 0 46 30"><path d="M18 10 C18 5 28 5 28 10 C28 14 23 14 23 18"/><circle cx="23" cy="23" r=".9" fill="currentColor"/></svg>'
};

function chip(name, k, txt, type, extra){
  var on = st[name] === k ? ' checked' : '';
  return '<label><input type="' + (type || 'radio') + '" name="' + name + '" value="' + k + '"' + on + '><span>' + (extra || '') + '<b style="font-weight:400">' + esc(txt) + '</b></span></label>';
}

function render(){
  document.documentElement.lang = lang;
  try{ localStorage.setItem('hyp-lang', lang); }catch(e){}
  langBar();
  var t = T[lang];
  if(missing.length){
    app.innerHTML = '<h1>' + t.title + '</h1><p class="closed">' + t.closed + '</p>' +
      (preview || /[?&]debug=1/.test(location.search) ? '<div class="miss">' + ({fr:'Réglages manquants : ', en:'Missing settings: ', zh:'设置还缺：'})[lang] + esc(HQ.validate(cfg, lang).join(lang === 'zh' ? '；' : ' ; ')) + '</div>' : '');
    return;
  }
  var A = cfg.A, cover = (A.refuse || []).indexOf('coverup') < 0;
  var types = ['custom', 'flash', 'own'].concat(cover ? ['cover'] : []);
  var places = D.ZONES.map(function(z){
    return '<optgroup label="' + esc(lab(z)) + '">' + D.PLACES.filter(function(p){ return p.z === z.k; }).map(function(p){
      return '<option value="' + p.k + '"' + (st.place === p.k ? ' selected' : '') + '>' + esc(lab(p)) + '</option>'; }).join('') + '</optgroup>';
  }).join('');
  app.innerHTML = '<h1>' + t.title + '</h1><p class="sub">' + esc(f(t.sub, {r:replyTxt()})) + '</p>' +
   '<div class="grid">' + profile() + '<form novalidate>' +
   '<fieldset><legend>' + t.type + '</legend><div class="chips">' + types.map(function(k){ return chip('type', k, t.types[k]); }).join('') + '</div><p class="hint" id="flashHint"' + (st.type === 'flash' ? '' : ' hidden') + '>' + t.flashHint + '</p><p class="hint" id="ownHint"' + (st.type === 'own' ? '' : ' hidden') + '>' + t.ownHint + '</p></fieldset>' +
   '<fieldset><legend>' + t.tech + '</legend><div class="chips tech">' + D.TECH.map(function(x){ return chip('tech', x.k, lab(x), 'radio', ICON[x.k]); }).join('') + '</div></fieldset>' +
   '<fieldset><legend>' + t.size + '</legend><div class="chips">' + D.SIZES.concat(D.LARGE).map(function(x){ return chip('size', x.k, lab(x)); }).join('') + '</div></fieldset>' +
   '<div><label class="lb" for="q-place">' + t.place + '</label><select id="q-place" name="place"><option value="">' + t.pick + '</option>' + places + '</select></div>' +
   '<fieldset id="firstQ" hidden><legend>' + t.first + '</legend><div class="chips">' + chip('first', 'yes', t.yes) + chip('first', 'no', t.no) + '</div></fieldset>' +
   '<fieldset><legend>' + t.color + '</legend><div class="chips">' + chip('color', 'bw', t.colors.bw) + chip('color', 'col', t.colors.col) + '</div></fieldset>' +
   '<div class="est" aria-live="polite" hidden></div>' +
   '<div><label class="lb" for="q-idea">' + t.idea + '</label><textarea id="q-idea" name="idea" placeholder="' + esc(t.ideaPh) + '">' + esc(st.idea) + '</textarea></div>' +
   '<div><label class="lb" for="q-refs">' + t.ref + '</label><input id="q-refs" type="file" name="refs" accept="image/*" multiple><p class="hint">' + t.refHint + '</p><div class="thumbs"></div></div>' +
   '<div class="row"><div><label class="lb" for="q-budget">' + t.budget + '</label><input id="q-budget" type="number" min="0" inputmode="numeric" name="budget" value="' + esc(st.budget) + '"></div>' +
   '<div><label class="lb" for="q-dates">' + t.dates + '</label><input id="q-dates" type="text" name="dates" placeholder="' + esc(t.datesPh) + '" value="' + esc(st.dates) + '"></div></div>' +
   '<div class="row"><div><label class="lb" for="q-name">' + t.name + ' <span class="req">*</span></label><input id="q-name" type="text" name="name" autocomplete="given-name" value="' + esc(st.name) + '"></div>' +
   '<div><label class="lb" for="q-email">' + t.email + ' <span class="req">*</span></label><input id="q-email" type="email" name="email" autocomplete="email" value="' + esc(st.email) + '"></div></div>' +
   '<div><label class="lb" for="q-contact">' + t.contact + '</label><input id="q-contact" type="text" name="contact" value="' + esc(st.contact) + '"></div>' +
   ((A.refuse || []).indexOf('minors') > -1 ? '<label class="check"><input type="checkbox" name="adult"' + (st.adult ? ' checked' : '') + '> ' + t.adult + '</label>' : '') +
   '<label class="check"><input type="checkbox" name="consent"' + (st.consent ? ' checked' : '') + '> <span>' + t.consent + '</span></label>' +
   '<button class="btn" type="submit">' + t.send + '</button><p class="msg" aria-live="polite"></p></form></div>';
  var fm = app.querySelector('form');
  fm.addEventListener('change', update);
  fm.querySelector('#q-refs').addEventListener('change', function(ev){
    files = [].slice.call(ev.target.files).filter(function(x){ return x.size <= 5e6; }).slice(0, 3);
    fm.querySelector('.thumbs').innerHTML = files.map(function(x){ return '<img alt="" src="' + URL.createObjectURL(x) + '">'; }).join('');
  });
  fm.addEventListener('submit', submit);
  update();
}

function read(){
  var fm = app.querySelector('form'), d = {};
  if(!fm) return d;
  new FormData(fm).forEach(function(v, k){ if(k !== 'refs') d[k] = v; });
  return d;
}
function save(){ var d = read(); if(Object.keys(d).length) st = d; }

function update(){
  var t = T[lang], fm = app.querySelector('form'), q = read(), box = fm.querySelector('.est');
  fm.querySelector('#flashHint').hidden = q.type !== 'flash';
  fm.querySelector('#ownHint').hidden = q.type !== 'own';
  var fv = find(D.REFUSE, 'first_visible');
  var askFirst = (cfg.A.refuse || []).indexOf('first_visible') > -1 && fv.p.indexOf(q.place) > -1;
  fm.querySelector('#firstQ').hidden = !askFirst;
  if(!askFirst) q.first = '';
  var e = HQ.estimate(cfg, q);
  if(e && e.refused){
    box.hidden = false; box.className = 'est no';
    box.innerHTML = '<span class="v">' + esc(f(t.refused, {x:lab(find(D.REFUSE, e.refused)).toLowerCase()})) + '</span>';
    return;
  }
  if(!e || !q.type || !q.size || !q.place || !q.color){ box.hidden = true; return; }
  box.hidden = false; box.className = 'est';
  box.innerHTML = '<span class="k">' + t.est + '</span><span class="v">' + e.lo + ' – ' + e.hi + ' €</span>' +
    (e.hours ? '<span class="l">' + esc(f(t.hours, {a:e.hours[0], b:e.hours[1], c:e.sessions[0] === e.sessions[1] ? e.sessions[0] : e.sessions[0] + '–' + e.sessions[1]})) + '</span>' : '') +
    (e.fee ? '<span class="l">' + esc(f(t.incl, {a:e.fee.lo + ' – ' + e.fee.hi + ' €'})) + '</span>' : '') +
    '<span class="l">' + t.dep + ' : ' + e.dep + ' € (' + (e.refundable ? t.depR : t.depNR) + (lang === 'zh' ? '，' : ', ') + (e.deducted ? t.depD : t.depX) + ')</span>' +
    '<span class="n">' + t.note + '</span>';
}

function toB64(file){ return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res({name:file.name, type:file.type, data:String(r.result).split(',')[1]}); }; r.onerror = rej; r.readAsDataURL(file); }); }

function submit(ev){
  ev.preventDefault();
  var t = T[lang], fm = ev.target, msg = fm.querySelector('.msg'), btn = fm.querySelector('.btn'), q = read();
  var miss = [];
  if(!q.type) miss.push(t.type); if(!q.size) miss.push(t.size); if(!q.place) miss.push(t.place); if(!q.color) miss.push(t.color);
  if(!fm.querySelector('#firstQ').hidden && !q.first) miss.push(t.first);
  if(!q.name) miss.push(t.name); if(!/.+@.+\..+/.test(q.email || '')) miss.push(t.email);
  if(fm.querySelector('[name=adult]') && !q.adult) miss.push(t.adult);
  if(!q.consent) miss.push(t.consent.split('.')[0]);
  if(miss.length){ msg.className = 'msg err'; msg.textContent = f(t.need, {x:miss.join(', ')}); return; }
  var e = HQ.estimate(cfg, q) || {};
  if(e.refused){ msg.className = 'msg err'; msg.textContent = f(t.refused, {x:lab(find(D.REFUSE, e.refused)).toLowerCase()}); return; }
  var d = {artist:cfg.id, config_version:cfg.version, lang:lang, page:location.href,
    type:q.type, technique:q.tech || 'unsure', size:q.size, place:q.place, place_tier:HQ.tierOf(cfg, q.place), color:q.color, first_tattoo:q.first || '',
    idea:q.idea || '', budget:q.budget || '', dates:q.dates || '', name:q.name, email:q.email, contact:q.contact || '',
    adult:q.adult ? 'oui' : '', consent:'oui',
    estimate_low:e.lo, estimate_high:e.hi, deposit:e.dep, design_fee:e.fee ? e.fee.lo + '-' + e.fee.hi : '', coef:Math.round(e.coef * 100) / 100,
    est_hours:e.hours ? e.hours.join('-') : '', est_sessions:e.sessions ? e.sessions.join('-') : ''};
  var ep = window.HQ_ENDPOINT;
  if(!ep || preview){ msg.className = 'msg ok'; msg.textContent = t.demo + ' ' + f(t.ok, {r:replyTxt()}); return; }
  btn.disabled = true; btn.textContent = t.sending;
  Promise.all(files.map(toB64)).then(function(imgs){
    d.images = imgs;
    return fetch(ep, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(d)});
  }).then(function(r){ return r.json(); }).then(function(j){
    if(!j.ok) throw 0;
    msg.className = 'msg ok'; msg.textContent = f(t.ok, {r:replyTxt()});
    fm.reset(); files = []; st = {}; fm.querySelector('.thumbs').innerHTML = ''; update();
  }).catch(function(){ msg.className = 'msg err'; msg.textContent = t.err; })
  .then(function(){ btn.disabled = false; btn.textContent = t.send; });
}
render();
})();
</script>
</body></html>
