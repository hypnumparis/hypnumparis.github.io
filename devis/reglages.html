<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>询价助手 · 纹身师设置</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f3e9;--card:#fbf8f2;--ink:#2a1c15;--soft:#6a5a4e;--line:rgba(42,28,21,.2);--good:#3d5a40;--bad:#8a2f24;--warn:#7a5a1e;}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IM Fell English','Songti SC','STSong','Noto Serif SC',Georgia,serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;}
a{color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:26px 20px 80px;}
h1{font-weight:400;font-size:30px;margin:24px 0 4px;}
.lead{color:var(--soft);margin:0 0 8px;}
section{border-top:1px solid var(--line);margin-top:34px;padding-top:22px;}
h2{font-weight:400;font-size:22px;margin:0 0 4px;}
h3{font-weight:400;font-size:17px;margin:22px 0 8px;}
.why{color:var(--soft);font-size:14px;margin:0 0 14px;}
.f{display:grid;gap:6px;margin:0 0 16px;min-width:0;}
.f > span{font-size:14px;color:var(--soft);}
input[type=text],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;border-radius:0;}
input[type=number]{max-width:160px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chips label{position:relative;}
.chips input{position:absolute;opacity:0;pointer-events:none;}
.chips span{display:inline-flex;align-items:center;min-height:38px;padding:6px 12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:15px;}
.chips input:checked + span{background:var(--ink);border-color:var(--ink);color:var(--bg);}
.inline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.inline input[type=number]{width:110px;}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 100px 16px 100px;gap:8px;align-items:center;margin-bottom:8px;}
.pair input{max-width:none !important;}
.tiers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;}
@media (max-width:560px){ .tiers{grid-template-columns:1fr;} .pair{grid-template-columns:minmax(0,1fr) 80px 12px 80px;} }
.tiers label{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:15px;}
.tiers select{width:auto;padding:4px 26px 4px 8px;font-size:14px;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 16px;border:1px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;text-decoration:none;}
.btn.solid{background:var(--ink);color:var(--bg);}
.rep{border:1px solid var(--ink);background:var(--card);padding:16px 18px;margin:14px 0 6px;}
.rep p{margin:0 0 10px;}
.rep .a{color:var(--good);} .rep .b{color:var(--warn);} .rep .c{color:var(--bad);}
.note{font-size:13px;color:var(--soft);}
.miss{border:1px solid var(--bad);color:var(--bad);padding:12px 16px;margin:12px 0;}
.okk{border:1px solid var(--good);color:var(--good);padding:12px 16px;margin:12px 0;}
textarea.out{min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:12px;}
.hide{display:none !important;}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
<a href="/devis/" class="note">← 询价表单</a>
<h1>询价助手 · 纹身师设置</h1>
<p class="lead">设置填完以前，客人的询价表单不会开放。填的内容会自动存在这台设备的浏览器里，可以随时回来接着填。</p>
<div id="app"></div>
</div>
<script src="hq-data.js"></script>
<script src="hq-core.js"></script>
<script src="config.js"></script>
<script>
(function(){
var D = HQ_DATA, app = document.getElementById('app');
var base = JSON.parse(JSON.stringify((window.HQ_ARTISTS || {})[window.HQ_ACTIVE] || {id:'artist', version:1, A:{}}));
var c = null;
try{ c = JSON.parse(localStorage.getItem('hq-draft') || 'null'); }catch(e){}
if(!c || c.id !== base.id) c = base;
c.A = c.A || {}; c.A.cost = c.A.cost || {}; c.A.reply = c.A.reply || {n:24, unit:'h'};
['styles','refuse','languages','payment'].forEach(function(k){ c.A[k] = c.A[k] || []; });
c.A.designFee = c.A.designFee || {has:null, amount:null, deducted:null};
c.A.retouch = c.A.retouch || {free:null, months:null};
c.M2 = c.M2 || {otherFixed:null, supplies:{per:'month', amount:null}, status:{k:'ae', pct:21.5}, targetNet:null, actualHours:null, actualClients:null, maxHours:null, speed:{s:null, m:null}};
c.B = c.B || {};
var B = c.B;
B.sizes = B.sizes || {xs:[null,null], s:[null,null], m:[null,null], l:[null,null]};
B.large = B.large || HQ.defaultLarge(c.M2.speed);
if(B.colorPct == null) B.colorPct = 20;
B.tiers = B.tiers || {n:0, d:20};
B.placeTier = B.placeTier || {};
if(B.coverPct == null) B.coverPct = 30;
B.tech = B.tech || {line:0, shade:15, fill:30};
B.stylePct = B.stylePct || {};
B.deposit = B.deposit || {type:'pct', pct:30, min:30, amount:null, refundable:false};
if(B.flashDiscount == null) B.flashDiscount = 0;
c.pricing = c.pricing || 'table';
var rep = null;

function get(p){ return p.split('.').reduce(function(o, k){ return o == null ? undefined : o[k]; }, c); }
function set(p, v){ var ks = p.split('.'), o = c; for(var i = 0; i < ks.length - 1; i++){ if(o[ks[i]] == null) o[ks[i]] = isNaN(+ks[i + 1]) ? {} : []; o = o[ks[i]]; } o[ks[ks.length - 1]] = v; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(x){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]; }); }
function zh(x){ return x.l.zh || x.l; }

function num(p, label, unit, extra){ var v = get(p); return '<label class="f"><span>' + label + '</span><div class="inline"><input type="number" step="any" min="0" data-p="' + p + '" value="' + (v == null ? '' : v) + '"' + (extra || '') + '>' + (unit ? '<span>' + unit + '</span>' : '') + '</div></label>'; }
function txt(p, label, ph){ return '<label class="f"><span>' + label + '</span><input type="text" data-p="' + p + '" value="' + esc(get(p)) + '" placeholder="' + esc(ph || '') + '"></label>'; }
function radio(p, label, opts){ var v = get(p); return '<div class="f"><span>' + label + '</span><div class="chips">' + opts.map(function(o){ return '<label><input type="radio" name="' + p + '" data-p="' + p + '" data-t="' + (typeof o[0]) + '" value="' + o[0] + '"' + (String(v) === String(o[0]) ? ' checked' : '') + '><span>' + o[1] + '</span></label>'; }).join('') + '</div></div>'; }
function multi(p, label, opts){ var v = get(p) || []; return '<div class="f"><span>' + label + '</span><div class="chips">' + opts.map(function(o){ return '<label><input type="checkbox" data-arr="' + p + '" value="' + o[0] + '"' + (v.indexOf(o[0]) > -1 ? ' checked' : '') + '><span>' + o[1] + '</span></label>'; }).join('') + '</div></div>'; }
function pair(p, label){ var v = get(p) || []; return '<div class="pair"><span>' + label + '</span><input type="number" step="any" min="0" data-p="' + p + '.0" value="' + (v[0] == null ? '' : v[0]) + '"><span>–</span><input type="number" step="any" min="0" data-p="' + p + '.1" value="' + (v[1] == null ? '' : v[1]) + '"></div>'; }

function render(){
  var A = c.A;
  var h = '';
  /* ---------- A ---------- */
  h += '<section><h2>第一步 · 纹身师资料</h2><p class="why">这部分不参与估价。用来展示给客人、在「帮我定价」里算建议价，以及以后做数据分析。</p>';
  h += '<h3>身份和经验</h3>' + txt('A.name', '名字 / 品牌名') + num('A.years', '纹了几年', '年', ' style="max-width:120px"') + txt('A.instagram', 'Instagram 账号（选填，会在表单上展示）', '例如 hypnum.paris');
  h += '<h3>工作方式</h3>' + radio('A.work', '工作方式', [['split','工作室分成'],['desk','租工位'],['own','自己的工作室'],['home','在家'],['guest','guest 或展会为主']]);
  h += '<div data-show="split">' + num('A.cost.splitPct', '工作室拿走多少', '%') + '</div>';
  h += '<div data-show="desk">' + radio('A.cost.deskUnit', '工位怎么付', [['day','按天'],['session','按次'],['month','按月']]) + '<div data-show="deskday">' + num('A.cost.deskPrice', '每天多少钱', '€ / 天') + num('A.cost.deskDays', '每个月大约租几天', '天') + '</div><div data-show="desksess">' + num('A.cost.deskPrice', '每次多少钱', '€ / 次') + '</div><div data-show="deskmonth">' + num('A.cost.deskPrice', '每月多少钱', '€ / 月') + num('A.daysPerMonth', '每个月在这个工位工作几天', '天') + '</div></div>';
  h += '<div data-show="own">' + num('A.cost.monthly', '每月房租和杂费大约多少', '€ / 月') + '</div>';
  h += txt('A.location', '地点（巴黎几区或城市）', '例如 Paris 11e');
  h += '<div data-show="notmonth">' + num('A.daysPerMonth', '每个月大约能工作几天', '天') + '</div>' + '<p class="note" data-show="deskday">按天租工位时，默认等于每月租的天数。</p>';
  h += num('A.maxSession', '单次最长做几个小时', '小时');
  h += '<div class="f"><span>回复时间（显示在客人表单上）</span><div class="inline"><input type="number" min="1" data-p="A.reply.n" value="' + esc(A.reply.n) + '" style="width:90px"><select data-p="A.reply.unit" style="width:auto"><option value="h"' + (A.reply.unit === 'h' ? ' selected' : '') + '>小时</option><option value="d"' + (A.reply.unit === 'd' ? ' selected' : '') + '>天</option></select></div></div>';
  h += '<h3>风格和接单规则</h3>' + multi('A.styles', '擅长的风格', D.STYLES.map(function(s){ return [s.k, s.l.zh + ' ' + s.l.fr]; }));
  h += '<div data-show="styleother">' + txt('A.styleOther', '其他风格（自己填）') + '</div>';
  h += multi('A.refuse', '不接的类型', D.REFUSE.map(function(r){ return [r.k, r.l.zh + (r.k === 'minors' ? '（法国 18 岁以下需要家长书面同意）' : '')]; })) + txt('A.refuseOther', '其他不接的（自己填，选填）');
  h += multi('A.languages', '会说的语言', D.LANGS.map(function(x){ return [x.k, x.l]; }));
  h += radio('A.designFee.has', '设计费', [[true,'有'],[false,'没有']]);
  h += '<div data-show="fee">' + num('A.designFee.amount', '设计费多少', '€') + radio('A.designFee.deducted', '是否从总价里扣', [[true,'从总价里扣'],[false,'另外收']]) + '</div>';
  h += '<div class="f"><span>补色政策</span><div class="inline">免费补色 <input type="number" min="0" data-p="A.retouch.free" value="' + esc(A.retouch.free) + '" style="width:80px"> 次，在 <input type="number" min="0" data-p="A.retouch.months" value="' + esc(A.retouch.months) + '" style="width:80px"> 个月内</div></div>';
  h += multi('A.payment', '支付方式', D.PAY.map(function(x){ return [x.k, x.l.zh]; })) + txt('A.payOther', '其他支付方式（选填）');
  h += '</section>';

  /* ---------- Mode ---------- */
  h += '<section><h2>第二步 · 选择模式</h2>' + radio('mode', '你的价格', [[1,'我已经有自己的价格'],[2,'我不知道怎么定价，帮我算']]) + '</section>';

  /* ---------- Mode 2 ---------- */
  h += '<section data-show="m2"><h2>帮我定价</h2><p class="why">回答下面的问题，系统算出一份建议价格表。这些答案只用于计算，绝不展示给客人，也不会出现在任何公开数据里。</p>';
  h += num('M2.otherFixed', '其他每月固定开支（保险、软件、广告等，不含租金或分成）', '€ / 月');
  h += '<div class="f"><span>耗材大约多少钱</span><div class="inline"><input type="number" min="0" step="any" data-p="M2.supplies.amount" value="' + esc(c.M2.supplies.amount) + '" style="width:110px"> € <select data-p="M2.supplies.per" style="width:auto"><option value="month"' + (c.M2.supplies.per === 'month' ? ' selected' : '') + '>每月</option><option value="session"' + (c.M2.supplies.per === 'session' ? ' selected' : '') + '>每次</option></select></div></div>';
  h += radio('M2.status.k', '你的经营身份（决定要交多少社保和税）', D.STATUS.map(function(s){ return [s.k, s.l]; }));
  h += num('M2.status.pct', '实际比例（默认值，可以改成你自己算过的比例）', '%');
  h += num('M2.targetNet', '想每月净赚多少', '€ / 月');
  h += num('M2.actualHours', '现在每月实际大约纹多少个小时（实际接到的活）', '小时 / 月') + num('M2.actualClients', '或者：每月大约多少个客人', '个 / 月');
  h += num('M2.maxHours', '每月最多能纹多少个小时（时间上限）', '小时 / 月');
  h += num('M2.speed.s', '一个 5–10 cm 的图你一般要几个小时', '小时') + num('M2.speed.m', '一个 10–15 cm 的呢', '小时');
  h += '<div class="bar"><button type="button" class="btn solid" id="doSuggest">算出建议价格</button></div><div id="rep"></div></section>';

  /* ---------- B ---------- */
  h += '<section data-show="b"><h2>第三步 · 价格规则</h2><p class="why">这部分决定客人看到的估价。模式二算出的建议会填在这里，你可以逐项修改。</p>';
  h += '<div data-show="m1">' + radio('pricing', '尺寸价格怎么填', [['table','我知道每档的价格'],['hourly','我只知道自己的时薪'],['none','我完全不知道（转到帮我定价）']]) + '</div>';
  h += num('B.hourly', '时薪（大面积按小时算，也用来从时薪算价格表）', '€ / 小时');
  h += '<div data-show="hourlyhelp"><p class="note">填了时薪以后，点下面的按钮，系统用「时薪 × 每档默认小时数」算出价格表，你再改。默认小时数：小于 5 cm 0.5–1，5–10 cm 1–2，10–15 cm 2–3.5，15–25 cm 3.5–6。</p>' + num('M2.speed.s', '（选填）一个 5–10 cm 的图你一般要几个小时', '小时') + num('M2.speed.m', '（选填）一个 10–15 cm 的呢', '小时') + '<div class="bar"><button type="button" class="btn" id="fromHourly">用时薪算出价格表</button></div></div>';
  h += num('B.min', '最低起价（任何纹身都不低于这个价）', '€');
  h += '<h3>按尺寸的价格区间（€，最低 – 最高）</h3>' + D.SIZES.map(function(s){ return pair('B.sizes.' + s.k, s.l.zh); }).join('');
  h += '<h3>大面积需要的小时数</h3>' + D.LARGE.map(function(s){ return pair('B.large.' + s.k, s.l.zh); }).join('') + '<div class="bar"><button type="button" class="btn" id="defLarge">我不确定，用默认值</button></div><p class="note">默认：半臂 10–15，满臂 20–30，整背 25–40 小时。填了速度会按你的速度自动调整。</p>';
  h += num('B.colorPct', '彩色加价', '%');
  h += '<h3>部位加价</h3><div class="inline" style="margin-bottom:12px">普通 +<input type="number" step="any" data-p="B.tiers.n" value="' + esc(B.tiers.n) + '" style="width:80px">%　难做 +<input type="number" step="any" data-p="B.tiers.d" value="' + esc(B.tiers.d) + '" style="width:80px">%</div>';
  h += '<p class="note">难做的部位贴着骨头、皮肤会随关节移动、恢复差容易掉色。每个部位可以挪到另一档。</p>';
  h += D.ZONES.map(function(z){ return '<h3>' + z.l.zh + '</h3><div class="tiers">' + D.PLACES.filter(function(p){ return p.z === z.k; }).map(function(p){ var t = B.placeTier[p.k] || p.t; return '<label>' + p.l.zh + '<select data-tier="' + p.k + '"><option value="n"' + (t === 'n' ? ' selected' : '') + '>普通</option><option value="d"' + (t === 'd' ? ' selected' : '') + '>难做</option></select></label>'; }).join('') + '</div>'; }).join('');
  h += '<div data-show="cover">' + num('B.coverPct', 'cover-up / 修改旧图加价', '%') + '</div>';
  h += '<h3>技法加价</h3><div class="inline">纯线条 +<input type="number" step="any" data-p="B.tech.line" value="' + esc(B.tech.line) + '" style="width:70px">%　线条 + 填色或阴影 +<input type="number" step="any" data-p="B.tech.shade" value="' + esc(B.tech.shade) + '" style="width:70px">%　纯填色 +<input type="number" step="any" data-p="B.tech.fill" value="' + esc(B.tech.fill) + '" style="width:70px">%</div><p class="note">客人选「我不确定」时按「线条 + 填色或阴影」算。</p>';
  h += '<h3>风格加价（选填，不进即时估价，你回复时自己确认）</h3>' + (A.styles.length ? A.styles.filter(function(k){ return k !== 'other'; }).map(function(k){ var s = D.STYLES.filter(function(x){ return x.k === k; })[0]; return num('B.stylePct.' + k, s.l.zh, '%'); }).join('') : '<p class="note">先在第一步选擅长的风格。</p>');
  h += '<h3>定金</h3>' + radio('B.deposit.type', '定金方式', [['pct','按百分比'],['fixed','固定金额']]);
  h += '<div data-show="dpct">' + num('B.deposit.pct', '价格下限的百分比', '%') + num('B.deposit.min', '最低多少', '€') + '</div><div data-show="dfix">' + num('B.deposit.amount', '固定金额', '€') + '</div>';
  h += radio('B.deposit.refundable', '能不能退', [[true,'可以退'],[false,'不退']]);
  h += num('B.flashDiscount', 'flash 折扣（flash 和定制图用同一张尺寸价格表，但不收设计费）', '%');
  h += '</section>';

  /* ---------- Save ---------- */
  h += '<section><h2>保存</h2><div id="status"></div><div class="bar"><a class="btn" href="/devis/?preview=1" target="_blank" rel="noopener">预览客人表单</a><button type="button" class="btn solid" id="copy">复制设置</button></div>' +
    '<p class="note">「预览」用的是这台设备上的草稿。设置完成后点「复制设置」，把内容发给我，我放进网站，表单就正式开放。</p><textarea class="out hide" readonly></textarea></section>';
  app.innerHTML = h;
  bind(); vis(); status();
  if(rep) showRep();
}

function bind(){
  app.querySelectorAll('[data-p]').forEach(function(el){
    el.addEventListener(el.type === 'radio' || el.tagName === 'SELECT' ? 'change' : 'input', function(){
      var p = el.getAttribute('data-p'), v = el.value;
      if(el.type === 'number') v = v === '' ? null : +v;
      if(el.type === 'radio'){ var t = el.getAttribute('data-t'); v = t === 'boolean' ? v === 'true' : t === 'number' ? +v : v; }
      set(p, v);
      if(p === 'mode' && v === 2) c.pricing = 'table';
      if(p === 'pricing' && v === 'none'){ c.mode = 2; c.pricing = 'table'; render(); return; }
      if(p === 'M2.status.k'){ c.M2.status.pct = D.STATUS.filter(function(s){ return s.k === v; })[0].pct; var e = app.querySelector('[data-p="M2.status.pct"]'); if(e) e.value = c.M2.status.pct; }
      if(p === 'A.cost.deskDays' && c.A.cost.deskUnit === 'day' && !c.A.daysPerMonth){ c.A.daysPerMonth = v; var e2 = app.querySelector('[data-p="A.daysPerMonth"]'); if(e2) e2.value = v; }
      app.querySelectorAll('[data-p="' + p + '"]').forEach(function(x){ if(x !== el && el.type !== 'radio' && x.type !== 'radio') x.value = el.value; });
      vis(); persist();
    });
  });
  app.querySelectorAll('[data-arr]').forEach(function(el){
    el.addEventListener('change', function(){
      var p = el.getAttribute('data-arr'), a = get(p) || [];
      a = a.filter(function(x){ return x !== el.value; }); if(el.checked) a.push(el.value);
      set(p, a); persist();
      if(p === 'A.styles' || p === 'A.refuse') render(); else vis();
    });
  });
  app.querySelectorAll('[data-tier]').forEach(function(el){
    el.addEventListener('change', function(){
      var k = el.getAttribute('data-tier'), d = D.PLACES.filter(function(p){ return p.k === k; })[0].t;
      if(el.value === d) delete c.B.placeTier[k]; else c.B.placeTier[k] = el.value;
      persist();
    });
  });
  var s = document.getElementById('doSuggest'); if(s) s.onclick = doSuggest;
  document.getElementById('fromHourly').onclick = function(){
    if(!(c.B.hourly > 0)){ alert('先填时薪。'); return; }
    var g = HQ.fromHourly(c.B.hourly, c.M2.speed); c.B.sizes = g.sizes; c.B.large = g.large;
    if(!c.B.min) c.B.min = HQ.r10(c.B.hourly);
    persist(); render();
  };
  document.getElementById('defLarge').onclick = function(){ c.B.large = HQ.defaultLarge(c.M2.speed); persist(); render(); };
  document.getElementById('copy').onclick = copy;
}

function vis(){
  var A = c.A, m = {
    split:A.work === 'split', desk:A.work === 'desk', deskday:A.work === 'desk' && A.cost.deskUnit === 'day', desksess:A.work === 'desk' && A.cost.deskUnit === 'session', deskmonth:A.work === 'desk' && A.cost.deskUnit === 'month', notmonth:!(A.work === 'desk' && A.cost.deskUnit === 'month'),
    own:A.work === 'own' || A.work === 'home' || A.work === 'guest', styleother:A.styles.indexOf('other') > -1,
    fee:A.designFee.has === true, m1:c.mode === 1, m2:c.mode === 2, b:c.mode === 1 || (c.mode === 2 && (!!rep || c.B.min > 0)),
    hourlyhelp:c.mode === 1 && c.pricing === 'hourly', cover:A.refuse.indexOf('coverup') < 0,
    dpct:c.B.deposit.type === 'pct', dfix:c.B.deposit.type === 'fixed'};
  app.querySelectorAll('[data-show]').forEach(function(el){ el.classList.toggle('hide', !m[el.getAttribute('data-show')]); });
}

function clean(){
  var o = JSON.parse(JSON.stringify(c)); delete o.pricing;
  if(o.mode !== 2) o.M2 = null;
  if(o.A.work !== 'split') delete o.A.cost.splitPct;
  if(o.A.work !== 'desk'){ delete o.A.cost.deskUnit; delete o.A.cost.deskPrice; delete o.A.cost.deskDays; }
  if(['own','home','guest'].indexOf(o.A.work) < 0) delete o.A.cost.monthly;
  return o;
}
function persist(){ try{ localStorage.setItem('hq-draft', JSON.stringify(clean())); }catch(e){} status(); }
function status(){
  var el = document.getElementById('status'); if(!el) return;
  var m = HQ.validate(clean());
  el.innerHTML = m.length ? '<div class="miss">还缺 ' + m.length + ' 项：' + esc(m.join('；')) + '</div>' : '<div class="okk">设置完整，表单可以使用。</div>';
}

function doSuggest(){
  var A = c.A, M = c.M2, need = [];
  if(!(A.years >= 0) || A.years === null) need.push('纹了几年');
  if(!A.work) need.push('工作方式');
  if(!A.styles.length) need.push('擅长的风格');
  if(!(M.targetNet > 0)) need.push('想每月净赚多少');
  if(!(M.actualHours > 0) && !(M.actualClients > 0)) need.push('每月实际纹多少小时或客人');
  if(!(M.speed.s > 0) || !(M.speed.m > 0)) need.push('两个速度问题');
  if(need.length){ document.getElementById('rep').innerHTML = '<div class="miss">先填：' + need.join('、') + '</div>'; return; }
  var r = HQ.suggest(A, M), keep = c.B;
  r.B.placeTier = keep.placeTier || {};
  c.B = r.B; rep = r.rep; persist(); render();
  var s = document.querySelector('[data-show="b"]'); if(s) s.scrollIntoView({behavior:'smooth'});
}
function showRep(){
  var r = rep, A = c.A, el = document.getElementById('rep'); if(!el) return;
  var sty = A.styles.filter(function(k){ return k !== 'other'; }).map(function(k){ return D.STYLES.filter(function(x){ return x.k === k; })[0].l.zh; }).join('、');
  var h = '<div class="rep"><p>巴黎纹了 ' + ({'0-1':'0–1 年','1-3':'1–3 年','3-5':'3–5 年','5+':'5 年以上'})[r.band.k] + '、做' + sty + '的纹身师，常见价格是 <b>' + r.market[0] + '–' + r.market[1] + ' €/小时</b>' + (r.junior ? '，经验还不长，建议先取区间的下半部分' : '') + '。建议你定 <b>' + r.rate + ' €/小时</b>。</p>';
  h += '<p>按这个价格，你每月要纹 <b>' + r.needBE + ' 小时</b>才保本，<b>' + r.needT + ' 小时</b>才能赚到目标收入；你现在每月大约纹 <b>' + r.hours + ' 小时</b>。</p>';
  if(r.verdict === 'a') h += '<p class="a">价格合适，甚至可以考虑涨价。</p>';
  else if(r.verdict === 'b') h += '<p class="b">不亏，但离目标还差每月 ' + r.gapT + ' 小时。重点是多接客，不是改价格。</p>';
  else h += '<p class="c">现在在亏钱，每月还差 ' + r.gapBE + ' 小时才保本。可以考虑降低固定成本（例如改成按次租工位、少租几天），或者先多花时间找客人。</p>';
  if(r.overMax) h += '<p class="c">按现在的价格和成本，就算每月排满 ' + r.maxHours + ' 小时也达不到目标收入。可以考虑往市场区间上限（' + r.rateTop + ' €/小时，需要每月 ' + r.needTatTop + ' 小时）定价，或者调低目标。</p>';
  if(r.rateIfAE) h += '<p>如果以后按 auto-entrepreneur 申报（约 21.5%），要拿到同样的收入，时薪要定到约 <b>' + r.rateIfAE + ' €/小时</b>。</p>';
  h += '<p class="note">计算用到的每月成本：租金 ' + r.rent + ' €，耗材 ' + r.supplies + ' €，其他固定开支 ' + r.other + ' €' + (r.split ? '，工作室分成 ' + Math.round(r.split * 100) + '%' : '') + '，社保和税 ' + Math.round(r.soc * 100) + '%。保本营业额 ' + r.breakEven + ' €/月，目标营业额 ' + r.target + ' €/月。</p>';
  h += '<p class="note">这是给你的建议，最终价格由你决定。下面的价格表已经按建议填好，可以逐项修改。</p></div>';
  el.innerHTML = h;
}

function copy(){
  var o = clean(), m = HQ.validate(o), ta = app.querySelector('textarea.out');
  var s = JSON.stringify(o, null, 2);
  ta.value = s; ta.classList.remove('hide');
  var done = function(){ document.getElementById('copy').textContent = m.length ? '已复制（设置还没填完）' : '已复制'; };
  try{ navigator.clipboard.writeText(s).then(done, function(){ ta.select(); done(); }); }catch(e){ ta.select(); done(); }
}
render();
})();
</script>
</body></html>
