<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Assistant de devis · Réglages</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f3e9;--card:#fbf8f2;--ink:#2a1c15;--soft:#6a5a4e;--line:rgba(42,28,21,.2);--good:#3d5a40;--bad:#8a2f24;--warn:#7a5a1e;}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IM Fell English','Songti SC','STSong','Noto Serif SC',Georgia,serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;}
a{color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:26px 20px 80px;}
h1{font-weight:400;font-size:30px;margin:24px 0 4px;}
.lead{color:var(--soft);margin:0 0 8px;}
section{border-top:1px solid var(--line);margin-top:34px;padding-top:22px;}
h2{font-weight:400;font-size:22px;margin:0 0 4px;}
h3{font-weight:400;font-size:17px;margin:22px 0 8px;}
.why{color:var(--soft);font-size:14px;margin:0 0 14px;}
.f{display:grid;gap:6px;margin:0 0 16px;min-width:0;}
.f > span{font-size:14px;color:var(--soft);}
input[type=text],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;border-radius:0;}
input[type=number]{max-width:160px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chips label{position:relative;}
.chips input{position:absolute;opacity:0;pointer-events:none;}
.chips span{display:inline-flex;align-items:center;min-height:38px;padding:6px 12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:15px;}
.chips input:checked + span{background:var(--ink);border-color:var(--ink);color:var(--bg);}
.inline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.inline input[type=number]{width:110px;}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 100px 16px 100px;gap:8px;align-items:center;margin-bottom:8px;}
.pair input{max-width:none !important;}
.tiers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;}
@media (max-width:560px){ .tiers{grid-template-columns:1fr;} .pair{grid-template-columns:minmax(0,1fr) 80px 12px 80px;} }
.tiers label{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:15px;}
.tiers select{width:auto;padding:4px 26px 4px 8px;font-size:14px;}
.tbox{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 18px;}
.tcol{border:1px solid var(--line);background:var(--card);padding:10px;min-height:120px;transition:background .15s;}
.tcol.over{background:#efe6d6;border-color:var(--ink);}
.tcol-h{font-size:14px;color:var(--soft);margin-bottom:8px;}
.tchips{display:flex;flex-wrap:wrap;gap:6px;}
.tchip{font:inherit;font-size:14px;line-height:1.3;padding:6px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:grab;text-align:left;}
.tchip.drag{opacity:.4;}
.tcol[data-drop=d] .tchip{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 16px;border:1px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;text-decoration:none;}
.btn.solid{background:var(--ink);color:var(--bg);}
.rep{border:1px solid var(--ink);background:var(--card);padding:16px 18px;margin:14px 0 6px;}
.rep p{margin:0 0 10px;}
.rep .a{color:var(--good);} .rep .b{color:var(--warn);} .rep .c{color:var(--bad);}
.note{font-size:13px;color:var(--soft);}
.miss{border:1px solid var(--bad);color:var(--bad);padding:12px 16px;margin:12px 0;}
.okk{border:1px solid var(--good);color:var(--good);padding:12px 16px;margin:12px 0;}
textarea.out{min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:12px;}
.hide{display:none !important;}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--soft);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a href="/devis/" class="note" id="back"></a><div class="lang" role="group" aria-label="Langue"></div></div>
<h1 id="h1"></h1>
<p class="lead" id="lead"></p>
<div id="app"></div>
</div>
<script src="hq-data.js"></script>
<script src="hq-core.js"></script>
<script src="config.js"></script>
<script>
(function(){
var D = HQ_DATA, app = document.getElementById('app');
var base = JSON.parse(JSON.stringify((window.HQ_ARTISTS || {})[window.HQ_ACTIVE] || {id:'artist', version:1, A:{}}));
var c = null;
try{ c = JSON.parse(localStorage.getItem('hq-draft') || 'null'); }catch(e){}
if(!c || c.id !== base.id) c = base;
c.A = c.A || {}; c.A.cost = c.A.cost || {}; c.A.reply = c.A.reply || {n:24, unit:'h'};
['styles','refuse','languages','payment'].forEach(function(k){ c.A[k] = c.A[k] || []; });
c.A.designFee = c.A.designFee || {pct:null};
c.A.retouch = c.A.retouch || {free:null, months:null};
c.M2 = c.M2 || {otherFixed:null, supplies:{per:'month', amount:null}, status:{k:'ae', pct:21.5}, targetNet:null, actualHours:null, actualClients:null, maxHours:null, speed:{s:null, m:null}};
c.B = c.B || {};
var B = c.B;
B.sizes = B.sizes || {xs:[null,null], s:[null,null], m:[null,null], l:[null,null]};
B.large = B.large || HQ.defaultLarge(c.M2.speed);
if(B.colorPct == null) B.colorPct = 20;
B.tiers = B.tiers || {n:0, d:20}; B.tiers.n = 0;
B.placeTier = B.placeTier || {};
if(B.coverPct == null) B.coverPct = 30;
B.tech = B.tech || {line:0, shade:15, fill:30};
B.stylePct = B.stylePct || {};
B.deposit = B.deposit || {type:'pct', pct:30, min:30, amount:null, refundable:false};
if(B.flashDiscount == null) B.flashDiscount = 0;
c.pricing = c.pricing || 'table';
var rep = null;

function get(p){ return p.split('.').reduce(function(o, k){ return o == null ? undefined : o[k]; }, c); }
function set(p, v){ var ks = p.split('.'), o = c; for(var i = 0; i < ks.length - 1; i++){ if(o[ks[i]] == null) o[ks[i]] = isNaN(+ks[i + 1]) ? {} : []; o = o[ks[i]]; } o[ks[ks.length - 1]] = v; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(x){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]; }); }
var lang = 'fr';
try{ var nl = (navigator.language || '').slice(0, 2); if(nl === 'en' || nl === 'zh') lang = nl; }catch(e){}
try{ var sl = localStorage.getItem('hyp-lang'); if(sl === 'fr' || sl === 'en' || sl === 'zh') lang = sl; }catch(e){}
function t(fr, en, zh){ return lang === 'en' ? en : lang === 'zh' ? zh : fr; }
function lab(x){ return x.l[lang] || x.l.fr; }
function sep(){ return lang === 'zh' ? '、' : ', '; }
function header(){
  document.documentElement.lang = lang;
  document.title = t('Assistant de devis · Réglages', 'Quote assistant · Settings', '询价助手 · 纹身师设置');
  document.getElementById('back').textContent = t('← Formulaire de devis', '← Quote form', '← 询价表单');
  document.getElementById('h1').textContent = t('Assistant de devis · Réglages du tatoueur', 'Quote assistant · Artist settings', '询价助手 · 纹身师设置');
  document.getElementById('lead').textContent = t('Le formulaire de devis reste fermé aux clients tant que les réglages ne sont pas complets. Vos réponses sont enregistrées automatiquement dans le navigateur de cet appareil : vous pouvez revenir les compléter à tout moment.', 'The quote form stays closed to clients until these settings are complete. Your answers are saved automatically in this device\'s browser, so you can come back and finish at any time.', '设置填完以前，客人的询价表单不会开放。填的内容会自动存在这台设备的浏览器里，可以随时回来接着填。');
  var b = document.querySelector('.lang');
  b.innerHTML = ['fr','en','zh'].map(function(l){ return '<button type="button" data-l="' + l + '" aria-pressed="' + (l === lang) + '">' + {fr:'FR', en:'EN', zh:'中文'}[l] + '</button>'; }).join('');
  b.querySelectorAll('button').forEach(function(x){ x.onclick = function(){ lang = x.getAttribute('data-l'); try{ localStorage.setItem('hyp-lang', lang); }catch(e){} var y = window.scrollY; render(); window.scrollTo(0, y); }; });
}

function num(p, label, unit, extra){ var v = get(p); return '<label class="f"><span>' + label + '</span><div class="inline"><input type="number" step="any" min="0" data-p="' + p + '" value="' + (v == null ? '' : v) + '"' + (extra || '') + '>' + (unit ? '<span>' + unit + '</span>' : '') + '</div></label>'; }
function txt(p, label, ph){ return '<label class="f"><span>' + label + '</span><input type="text" data-p="' + p + '" value="' + esc(get(p)) + '" placeholder="' + esc(ph || '') + '"></label>'; }
function radio(p, label, opts){ var v = get(p); return '<div class="f"><span>' + label + '</span><div class="chips">' + opts.map(function(o){ return '<label><input type="radio" name="' + p + '" data-p="' + p + '" data-t="' + (typeof o[0]) + '" value="' + o[0] + '"' + (String(v) === String(o[0]) ? ' checked' : '') + '><span>' + o[1] + '</span></label>'; }).join('') + '</div></div>'; }
function multi(p, label, opts){ var v = get(p) || []; return '<div class="f"><span>' + label + '</span><div class="chips">' + opts.map(function(o){ return '<label><input type="checkbox" data-arr="' + p + '" value="' + o[0] + '"' + (v.indexOf(o[0]) > -1 ? ' checked' : '') + '><span>' + o[1] + '</span></label>'; }).join('') + '</div></div>'; }
function pair(p, label){ var v = get(p) || []; return '<div class="pair"><span>' + label + '</span><input type="number" step="any" min="0" data-p="' + p + '.0" value="' + (v[0] == null ? '' : v[0]) + '"><span>–</span><input type="number" step="any" min="0" data-p="' + p + '.1" value="' + (v[1] == null ? '' : v[1]) + '"></div>'; }

function render(){
  var A = c.A;
  var h = '';
  var H = t('heures', 'hours', '小时'), DAYS = t('jours', 'days', '天');
  /* ---------- A ---------- */
  h += '<section><h2>' + t('Étape 1 · Votre profil', 'Step 1 · Your profile', '第一步 · 纹身师资料') + '</h2><p class="why">' + t('Cette partie n\'entre pas dans le calcul des estimations. Elle sert à vous présenter aux clients, à calculer un prix conseillé dans « Aidez-moi à fixer mes prix », et plus tard à analyser les données.', 'This part doesn\'t affect the estimates. It is shown to clients, used to work out a suggested price in "Help me set my prices", and later for data analysis.', '这部分不参与估价。用来展示给客人、在「帮我定价」里算建议价，以及以后做数据分析。') + '</p>';
  h += '<h3>' + t('Identité et expérience', 'Identity and experience', '身份和经验') + '</h3>' + txt('A.name', t('Nom ou nom d\'artiste', 'Name or artist name', '名字 / 品牌名')) + num('A.years', t('Depuis combien d\'années vous tatouez', 'How many years you have been tattooing', '纹了几年'), t('ans', 'years', '年'), ' style="max-width:120px"') + txt('A.instagram', t('Compte Instagram (facultatif, affiché sur le formulaire)', 'Instagram account (optional, shown on the form)', 'Instagram 账号（选填，会在表单上展示）'), t('par exemple hypnum.paris', 'e.g. hypnum.paris', '例如 hypnum.paris'));
  h += '<h3>' + t('Façon de travailler', 'How you work', '工作方式') + '</h3>' + radio('A.work', t('Façon de travailler', 'How you work', '工作方式'), [['split', t('Pourcentage au studio', 'Studio takes a share', '工作室分成')], ['desk', t('Location de poste', 'Desk rental', '租工位')], ['own', t('Mon propre studio', 'My own studio', '自己的工作室')], ['home', t('À domicile', 'At home', '在家')], ['guest', t('Surtout en guest ou en convention', 'Mostly guest spots or conventions', 'guest 或展会为主')]]);
  h += '<div data-show="split">' + num('A.cost.splitPct', t('Part prise par le studio', 'Share the studio takes', '工作室拿走多少'), '%') + '</div>';
  h += '<div data-show="desk">' + radio('A.cost.deskUnit', t('Comment vous payez le poste', 'How you pay for the desk', '工位怎么付'), [['day', t('À la journée', 'Per day', '按天')], ['session', t('À la séance', 'Per session', '按次')], ['month', t('Au mois', 'Per month', '按月')]]) + '<div data-show="deskday">' + num('A.cost.deskPrice', t('Prix par jour', 'Price per day', '每天多少钱'), t('€ / jour', '€ / day', '€ / 天')) + num('A.cost.deskDays', t('Jours loués par mois, environ', 'Days rented per month, roughly', '每个月大约租几天'), DAYS) + '</div><div data-show="desksess">' + num('A.cost.deskPrice', t('Prix par séance', 'Price per session', '每次多少钱'), t('€ / séance', '€ / session', '€ / 次')) + '</div><div data-show="deskmonth">' + num('A.cost.deskPrice', t('Prix par mois', 'Price per month', '每月多少钱'), t('€ / mois', '€ / month', '€ / 月')) + num('A.daysPerMonth', t('Jours de travail par mois à ce poste', 'Days you work at this desk per month', '每个月在这个工位工作几天'), DAYS) + '</div></div>';
  h += '<div data-show="own">' + num('A.cost.monthly', t('Loyer et charges par mois, environ', 'Rent and running costs per month, roughly', '每月房租和杂费大约多少'), t('€ / mois', '€ / month', '€ / 月')) + '</div>';
  h += txt('A.location', t('Lieu (arrondissement ou ville)', 'Location (arrondissement or city)', '地点（巴黎几区或城市）'), t('par exemple Paris 11e', 'e.g. Paris 11e', '例如 Paris 11e'));
  h += '<div data-show="notmonth">' + num('A.daysPerMonth', t('Jours de travail possibles par mois, environ', 'Days you can work per month, roughly', '每个月大约能工作几天'), DAYS) + '</div>' + '<p class="note" data-show="deskday">' + t('Pour un poste loué à la journée, c\'est par défaut le nombre de jours loués.', 'For a desk rented by the day, this defaults to the days rented.', '按天租工位时，默认等于每月租的天数。') + '</p>';
  h += num('A.maxSession', t('Durée maximale d\'une séance', 'Longest session you do', '单次最长做几个小时'), H);
  h += '<div class="f"><span>' + t('Délai de réponse (affiché sur le formulaire client)', 'Reply time (shown on the client form)', '回复时间（显示在客人表单上）') + '</span><div class="inline"><input type="number" min="1" data-p="A.reply.n" value="' + esc(A.reply.n) + '" style="width:90px"><select data-p="A.reply.unit" style="width:auto"><option value="h"' + (A.reply.unit === 'h' ? ' selected' : '') + '>' + H + '</option><option value="d"' + (A.reply.unit === 'd' ? ' selected' : '') + '>' + DAYS + '</option></select></div></div>';
  h += '<h3>' + t('Styles et règles', 'Styles and rules', '风格和接单规则') + '</h3>' + multi('A.styles', t('Vos styles', 'Your styles', '擅长的风格'), D.STYLES.map(function(s){ return [s.k, lang === 'zh' ? s.l.zh + ' ' + s.l.fr : lab(s)]; }));
  h += '<div data-show="styleother">' + txt('A.styleOther', t('Autre style (à préciser)', 'Other style (describe it)', '其他风格（自己填）')) + '</div>';
  h += multi('A.refuse', t('Ce que vous refusez', 'What you don\'t do', '不接的类型'), D.REFUSE.map(function(r){ return [r.k, lab(r) + (r.k === 'minors' ? t(' (en France, accord écrit des parents obligatoire avant 18 ans)', ' (in France, under 18 needs written parental consent)', '（法国 18 岁以下需要家长书面同意）') : '')]; })) + txt('A.refuseOther', t('Autre refus (facultatif)', 'Anything else you refuse (optional)', '其他不接的（自己填，选填）'));
  h += multi('A.languages', t('Langues parlées', 'Languages you speak', '会说的语言'), D.LANGS.map(function(x){ return [x.k, x.l]; }));
  h += num('A.designFee.pct', t('Supplément dessin : de combien de pourcents un tatouage dessiné sur mesure est plus cher qu\'un tatouage normal (les flashs et les dessins du client ne sont pas concernés)', 'Design surcharge: how many percent more a custom-drawn tattoo costs than a regular one (flashes and the client\'s own designs aren\'t affected)', '设计费：需要我画设计稿的图比普通纹身贵百分之多少（纹身稿和客人自己的图不加）'), '%');
  h += '<div class="f"><span>' + t('Retouches', 'Touch-ups', '补色政策') + '</span><div class="inline">' + t('Retouches offertes :', 'Free touch-ups:', '免费补色') + ' <input type="number" min="0" data-p="A.retouch.free" value="' + esc(A.retouch.free) + '" style="width:80px"> ' + t('fois, dans les', 'within', '次，在') + ' <input type="number" min="0" data-p="A.retouch.months" value="' + esc(A.retouch.months) + '" style="width:80px"> ' + t('mois', 'months', '个月内') + '</div></div>';
  h += multi('A.payment', t('Moyens de paiement', 'Payment methods', '支付方式'), D.PAY.map(function(x){ return [x.k, lab(x)]; })) + txt('A.payOther', t('Autre moyen de paiement (facultatif)', 'Other payment method (optional)', '其他支付方式（选填）'));
  h += '</section>';

  /* ---------- Mode ---------- */
  h += '<section><h2>' + t('Étape 2 · Choisir le mode', 'Step 2 · Choose a mode', '第二步 · 选择模式') + '</h2>' + radio('mode', t('Vos prix', 'Your prices', '你的价格'), [[1, t('J\'ai déjà mes prix', 'I already have my prices', '我已经有自己的价格')], [2, t('Je débute, aidez-moi à fixer mes prix', 'I\'m new, help me set my prices', '我是新人纹身师，帮我定价')]]) + '</section>';

  /* ---------- Mode 2 ---------- */
  var PM = t('€ / mois', '€ / month', '€ / 月'), HM = t('heures / mois', 'hours / month', '小时 / 月');
  h += '<section data-show="m2"><h2>' + t('Aidez-moi à fixer mes prix', 'Help me set my prices', '帮我定价') + '</h2><p class="why">' + t('Répondez aux questions ci-dessous pour obtenir une grille de prix conseillée. Ces réponses servent uniquement au calcul : elles ne sont jamais montrées aux clients ni publiées.', 'Answer the questions below to get a suggested price list. These answers are only used for the calculation: they are never shown to clients or published.', '回答下面的问题，系统算出一份建议价格表。这些答案只用于计算，绝不展示给客人，也不会出现在任何公开数据里。') + '</p>';
  h += num('M2.otherFixed', t('Autres frais fixes par mois (assurance, logiciels, publicité…, sans le loyer ni la part du studio)', 'Other fixed costs per month (insurance, software, ads…, excluding rent or studio share)', '其他每月固定开支（保险、软件、广告等，不含租金或分成）'), PM);
  h += '<div class="f"><span>' + t('Consommables, environ', 'Supplies, roughly', '耗材大约多少钱') + '</span><div class="inline"><input type="number" min="0" step="any" data-p="M2.supplies.amount" value="' + esc(c.M2.supplies.amount) + '" style="width:110px"> € <select data-p="M2.supplies.per" style="width:auto"><option value="month"' + (c.M2.supplies.per === 'month' ? ' selected' : '') + '>' + t('par mois', 'per month', '每月') + '</option><option value="session"' + (c.M2.supplies.per === 'session' ? ' selected' : '') + '>' + t('par séance', 'per session', '每次') + '</option></select></div></div>';
  h += radio('M2.status.k', t('Votre statut (détermine les cotisations et impôts)', 'Your business status (sets social charges and tax)', '你的经营身份（决定要交多少社保和税）'), D.STATUS.map(function(s){ return [s.k, lab(s)]; }));
  h += num('M2.status.pct', t('Taux réel (valeur par défaut, modifiable si vous avez votre propre calcul)', 'Actual rate (default value, change it if you have your own figure)', '实际比例（默认值，可以改成你自己算过的比例）'), '%');
  h += num('M2.targetNet', t('Combien vous voulez gagner net par mois', 'How much you want to earn net per month', '想每月净赚多少'), PM);
  h += num('M2.actualHours', t('Combien d\'heures vous tatouez vraiment par mois en ce moment (clients réels)', 'How many hours you actually tattoo per month right now (real bookings)', '现在每月实际大约纹多少个小时（实际接到的活）'), HM) + num('M2.actualClients', t('Ou : combien de clients par mois, environ', 'Or: how many clients per month, roughly', '或者：每月大约多少个客人'), t('clients / mois', 'clients / month', '个 / 月'));
  h += num('M2.maxHours', t('Nombre d\'heures maximum que vous pouvez tatouer par mois', 'Most hours you could tattoo per month', '每月最多能纹多少个小时（时间上限）'), HM);
  h += num('M2.speed.s', t('Combien d\'heures il vous faut en général pour un tatouage de 5 à 10 cm', 'How many hours a 5 to 10 cm tattoo usually takes you', '一个 5–10 cm 的图你一般要几个小时'), H) + num('M2.speed.m', t('Et pour un tatouage de 10 à 15 cm', 'And a 10 to 15 cm one', '一个 10–15 cm 的呢'), H);
  h += '<div class="bar"><button type="button" class="btn solid" id="doSuggest">' + t('Calculer les prix conseillés', 'Work out suggested prices', '算出建议价格') + '</button></div><div id="rep"></div></section>';

  /* ---------- B ---------- */

function bind(){
  app.querySelectorAll('[data-p]').forEach(function(el){
    el.addEventListener(el.type === 'radio' || el.tagName === 'SELECT' ? 'change' : 'input', function(){
      var p = el.getAttribute('data-p'), v = el.value;
      if(el.type === 'number') v = v === '' ? null : +v;
      if(el.type === 'radio'){ var t = el.getAttribute('data-t'); v = t === 'boolean' ? v === 'true' : t === 'number' ? +v : v; }
      set(p, v);
      if(p === 'mode' && v === 2) c.pricing = 'table';
      if(p === 'pricing' && v === 'none'){ c.mode = 2; c.pricing = 'table'; render(); return; }
      if(p === 'M2.status.k'){ c.M2.status.pct = D.STATUS.filter(function(s){ return s.k === v; })[0].pct; var e = app.querySelector('[data-p="M2.status.pct"]'); if(e) e.value = c.M2.status.pct; }
      if(p === 'A.cost.deskDays' && c.A.cost.deskUnit === 'day' && !c.A.daysPerMonth){ c.A.daysPerMonth = v; var e2 = app.querySelector('[data-p="A.daysPerMonth"]'); if(e2) e2.value = v; }
      app.querySelectorAll('[data-p="' + p + '"]').forEach(function(x){ if(x !== el && el.type !== 'radio' && x.type !== 'radio') x.value = el.value; });
      vis(); persist();
    });
  });
  app.querySelectorAll('[data-arr]').forEach(function(el){
    el.addEventListener('change', function(){
      var p = el.getAttribute('data-arr'), a = get(p) || [];
      a = a.filter(function(x){ return x !== el.value; }); if(el.checked) a.push(el.value);
      set(p, a); persist();
      if(p === 'A.styles' || p === 'A.refuse') render(); else vis();
    });
  });
  function moveTier(k, to){
    var d = D.PLACES.filter(function(p){ return p.k === k; })[0].t;
    if(to === d) delete c.B.placeTier[k]; else c.B.placeTier[k] = to;
    persist();
    var y = window.scrollY; render(); window.scrollTo(0, y);
  }
  app.querySelectorAll('.tchip').forEach(function(el){
    var k = el.getAttribute('data-place');
    el.addEventListener('dragstart', function(e){ e.dataTransfer.setData('text/plain', k); e.dataTransfer.effectAllowed = 'move'; el.classList.add('drag'); });
    el.addEventListener('dragend', function(){ el.classList.remove('drag'); });
    el.addEventListener('click', function(){ var cur = el.closest('[data-drop]').getAttribute('data-drop'); moveTier(k, cur === 'n' ? 'd' : 'n'); });
  });
  app.querySelectorAll('[data-drop]').forEach(function(box){
    box.addEventListener('dragover', function(e){ e.preventDefault(); box.classList.add('over'); });
    box.addEventListener('dragleave', function(){ box.classList.remove('over'); });
    box.addEventListener('drop', function(e){ e.preventDefault(); box.classList.remove('over'); var k = e.dataTransfer.getData('text/plain'); if(k) moveTier(k, box.getAttribute('data-drop')); });
  });
  var s = document.getElementById('doSuggest'); if(s) s.onclick = doSuggest;
  document.getElementById('fromHourly').onclick = function(){
    if(!(c.B.hourly > 0)){ alert(t('Indiquez d\'abord votre taux horaire.', 'Fill in your hourly rate first.', '先填时薪。')); return; }
    var g = HQ.fromHourly(c.B.hourly, c.M2.speed); c.B.sizes = g.sizes; c.B.large = g.large;
    if(!c.B.min) c.B.min = HQ.r10(c.B.hourly);
    persist(); render();
  };
  document.getElementById('defLarge').onclick = function(){ c.B.large = HQ.defaultLarge(c.M2.speed); persist(); render(); };
  document.getElementById('copy').onclick = copy;
}

function vis(){
  var A = c.A, m = {
    split:A.work === 'split', desk:A.work === 'desk', deskday:A.work === 'desk' && A.cost.deskUnit === 'day', desksess:A.work === 'desk' && A.cost.deskUnit === 'session', deskmonth:A.work === 'desk' && A.cost.deskUnit === 'month', notmonth:!(A.work === 'desk' && A.cost.deskUnit === 'month'),
    own:A.work === 'own' || A.work === 'home' || A.work === 'guest', styleother:A.styles.indexOf('other') > -1,
    fee:A.designFee.has === true, m1:c.mode === 1, m2:c.mode === 2, b:c.mode === 1 || (c.mode === 2 && (!!rep || c.B.min > 0)),
    hourlyhelp:c.mode === 1 && c.pricing === 'hourly', cover:A.refuse.indexOf('coverup') < 0,
    dpct:c.B.deposit.type === 'pct', dfix:c.B.deposit.type === 'fixed'};
  app.querySelectorAll('[data-show]').forEach(function(el){ el.classList.toggle('hide', !m[el.getAttribute('data-show')]); });
}

function clean(){
  var o = JSON.parse(JSON.stringify(c)); delete o.pricing;
  if(o.mode !== 2) o.M2 = null;
  if(o.A.work !== 'split') delete o.A.cost.splitPct;
  if(o.A.work !== 'desk'){ delete o.A.cost.deskUnit; delete o.A.cost.deskPrice; delete o.A.cost.deskDays; }
  if(['own','home','guest'].indexOf(o.A.work) < 0) delete o.A.cost.monthly;
  return o;
}
function persist(){ try{ localStorage.setItem('hq-draft', JSON.stringify(clean())); }catch(e){} status(); }
function status(){
  var el = document.getElementById('status'); if(!el) return;
  var m = HQ.validate(clean(), lang);
  el.innerHTML = m.length ? '<div class="miss">' + t('Il manque ' + m.length + ' élément' + (m.length > 1 ? 's' : '') + ' : ', m.length + ' item' + (m.length > 1 ? 's' : '') + ' missing: ', '还缺 ' + m.length + ' 项：') + esc(m.join(lang === 'zh' ? '；' : ' ; ')) + '</div>' : '<div class="okk">' + t('Réglages complets, le formulaire peut être utilisé.', 'Settings complete, the form is ready to use.', '设置完整，表单可以使用。') + '</div>';
}

function doSuggest(){
  var A = c.A, M = c.M2, need = [];
  if(!(A.years >= 0) || A.years === null) need.push(t('années d\'expérience', 'years of experience', '纹了几年'));
  if(!A.work) need.push(t('façon de travailler', 'how you work', '工作方式'));
  if(!A.styles.length) need.push(t('vos styles', 'your styles', '擅长的风格'));
  if(!(M.targetNet > 0)) need.push(t('revenu net visé', 'target net income', '想每月净赚多少'));
  if(!(M.actualHours > 0) && !(M.actualClients > 0)) need.push(t('heures ou clients par mois', 'hours or clients per month', '每月实际纹多少小时或客人'));
  if(!(M.speed.s > 0) || !(M.speed.m > 0)) need.push(t('les deux questions de vitesse', 'the two speed questions', '两个速度问题'));
  if(need.length){ document.getElementById('rep').innerHTML = '<div class="miss">' + t('À remplir d\'abord : ', 'Fill in first: ', '先填：') + need.join(sep()) + '</div>'; return; }
  var r = HQ.suggest(A, M), keep = c.B;
  r.B.placeTier = keep.placeTier || {};
  c.B = r.B; rep = r.rep; persist(); render();
  var s = document.querySelector('[data-show="b"]'); if(s) s.scrollIntoView({behavior:'smooth'});
}

  if(r.rateIfAE) h += '<p>' + t('Si vous déclarez plus tard en auto-entrepreneur (environ 21,5 %), il faudra un taux d\'environ <b>' + r.rateIfAE + ' €/h</b> pour garder le même revenu.', 'If you later register as auto-entrepreneur (about 21.5%), you\'d need about <b>' + r.rateIfAE + ' €/h</b> to keep the same income.', '如果以后按 auto-entrepreneur 申报（约 21.5%），要拿到同样的收入，时薪要定到约 <b>' + r.rateIfAE + ' €/小时</b>。') + '</p>';
  h += '<p class="note">' + t('Frais mensuels utilisés : loyer ' + r.rent + ' €, consommables ' + r.supplies + ' €, autres frais fixes ' + r.other + ' €' + (r.split ? ', part du studio ' + Math.round(r.split * 100) + ' %' : '') + ', cotisations et impôts ' + Math.round(r.soc * 100) + ' %. Chiffre d\'affaires pour couvrir les frais : ' + r.breakEven + ' €/mois ; pour l\'objectif : ' + r.target + ' €/mois.',
    'Monthly costs used: rent ' + r.rent + ' €, supplies ' + r.supplies + ' €, other fixed costs ' + r.other + ' €' + (r.split ? ', studio share ' + Math.round(r.split * 100) + '%' : '') + ', social charges and tax ' + Math.round(r.soc * 100) + '%. Break-even turnover ' + r.breakEven + ' €/month; target turnover ' + r.target + ' €/month.',
    '计算用到的每月成本：租金 ' + r.rent + ' €，耗材 ' + r.supplies + ' €，其他固定开支 ' + r.other + ' €' + (r.split ? '，工作室分成 ' + Math.round(r.split * 100) + '%' : '') + '，社保和税 ' + Math.round(r.soc * 100) + '%。保本营业额 ' + r.breakEven + ' €/月，目标营业额 ' + r.target + ' €/月。') + '</p>';
  h += '<p class="note">' + t('C\'est un conseil : le prix final vous appartient. La grille ci-dessous est déjà remplie avec ces suggestions, et vous pouvez tout modifier.', 'This is a suggestion; the final price is your call. The list below is already filled in with it, and you can change anything.', '这是给你的建议，最终价格由你决定。下面的价格表已经按建议填好，可以逐项修改。') + '</p></div>';
  el.innerHTML = h;
}

function copy(){
  var o = clean(), m = HQ.validate(o), ta = app.querySelector('textarea.out');
  var s = JSON.stringify(o, null, 2);
  ta.value = s; ta.classList.remove('hide');
  var done = function(){ document.getElementById('copy').textContent = m.length ? t('Copié (réglages incomplets)', 'Copied (settings not finished)', '已复制（设置还没填完）') : t('Copié', 'Copied', '已复制'); };
  try{ navigator.clipboard.writeText(s).then(done, function(){ ta.select(); done(); }); }catch(e){ ta.select(); done(); }
}
render();
})();
</script>
